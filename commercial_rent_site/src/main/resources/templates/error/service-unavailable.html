<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Сервис недоступен</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #fff5eb 0%, #ffe0cc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .error-container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            animation: fadeInUp 0.5s ease;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .error-icon {
            font-size: 80px;
            color: #ff9800;
            margin-bottom: 20px;
        }
        h1 {
            color: #ff5722;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background: #ff5722;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            background: #e64a19;
            transform: translateY(-2px);
        }
        .support-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
        }
        .support-label {
            font-size: 13px;
            color: #999;
            margin-bottom: 8px;
            display: block;
        }
        .email-link {
            color: #ff5722;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .email-link:hover {
            color: #e64a19;
            text-decoration: underline;
        }
        @media (max-width: 480px) {
            .error-container {
                padding: 30px 20px;
            }
            .error-icon {
                font-size: 60px;
            }
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-icon">
        <i class="fas fa-tools"></i>
    </div>
    <h1>Сервис временно недоступен</h1>
    <p>
        Каталог помещений в данный момент недоступен.<br>
        Вы не можете добавить новое объявление.<br>
        Пожалуйста, попробуйте позже.
    </p>

    <div class="support-box">
        <div class="support-label">
            <i class="fas fa-headset"></i> Почта поддержки
        </div>
        <a href="mailto:support@rentapp.ru" class="email-link">
            <i class="fas fa-envelope"></i> support@rentapp.ru
        </a>
    </div>

    <a href="/" class="btn">На главную</a>
</div>
</body>
</html>
