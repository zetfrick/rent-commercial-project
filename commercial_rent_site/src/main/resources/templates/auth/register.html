<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация — Аренда коммерческих помещений</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
        .container { max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #d32f2f; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type=text], input[type=email], input[type=password] {
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box;
        }
        input.error-border { border-color: #f44336; }
        .error-message { color: #f44336; font-size: 0.8em; margin-top: 5px; display: block; }
        .global-error { background: #ffebee; color: #c62828; padding: 10px; border-radius: 5px; margin-bottom: 20px; text-align: center; }
        button { background: #ff9800; color: white; padding: 12px; width: 100%; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #f57c00; }
        .login-link { text-align: center; margin-top: 20px; }
        .login-link a { color: #ff9800; text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <h2>Регистрация</h2>

    <!-- Глобальная ошибка (логин или email занят) -->
    <div th:if="${error}" class="global-error" th:text="${error}"></div>

    <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post">
        <div class="form-group">
            <label for="firstName">Имя *</label>
            <input type="text" id="firstName" th:field="*{firstName}"
                   th:classappend="${#fields.hasErrors('firstName')} ? 'error-border' : ''" />
            <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="error-message">Ошибка</span>
        </div>

        <div class="form-group">
            <label for="lastName">Фамилия *</label>
            <input type="text" id="lastName" th:field="*{lastName}"
                   th:classappend="${#fields.hasErrors('lastName')} ? 'error-border' : ''" />
            <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="error-message">Ошибка</span>
        </div>

        <div class="form-group">
            <label for="login">Логин *</label>
            <input type="text" id="login" th:field="*{login}"
                   th:classappend="${#fields.hasErrors('login')} ? 'error-border' : ''" />
            <span th:if="${#fields.hasErrors('login')}" th:errors="*{login}" class="error-message">Ошибка</span>
            <span th:if="${loginError}" class="error-message" th:text="${loginError}"></span>
        </div>

        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'error-border' : ''" />
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-message">Ошибка</span>
            <span th:if="${emailError}" class="error-message" th:text="${emailError}"></span>
        </div>

        <div class="form-group">
            <label for="password">Пароль *</label>
            <input type="password" id="password" th:field="*{password}"
                   th:classappend="${#fields.hasErrors('password')} ? 'error-border' : ''" />
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-message">Ошибка</span>
        </div>

        <button type="submit">Зарегистрироваться</button>
    </form>

    <div class="login-link">
        Уже есть аккаунт? <a th:href="@{/auth/login}">Войти</a>
    </div>
</div>
</body>
</html>
