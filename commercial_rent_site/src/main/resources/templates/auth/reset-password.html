<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Новый пароль</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #fff5eb 0%, #ffe0cc 100%);
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 50%;
            right: -10%;
            width: 40%;
            height: 80%;
            background: radial-gradient(circle, rgba(255, 87, 34, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: 20%;
            left: -10%;
            width: 40%;
            height: 60%;
            background: radial-gradient(circle, rgba(255, 152, 0, 0.04) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .auth-form {
            background: white;
            padding: 40px;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            width: 450px;
            text-align: center;
            position: relative;
            z-index: 2;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-form h2 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #ff5722;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .auth-form h2 i {
            font-size: 28px;
        }

        .auth-form .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .password-wrapper {
            position: relative;
            margin: 10px 0;
        }

        .password-wrapper input {
            width: 100%;
            padding: 14px 16px;
            padding-right: 45px;
            border: 2px solid #ffe0cc;
            border-radius: 16px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            background: #fffaf5;
            box-sizing: border-box;
        }

        .password-wrapper input:focus {
            outline: none;
            border-color: #ff5722;
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 87, 34, 0.1);
        }

        /* Отключаем нативную кнопку показа пароля */
        .password-wrapper input::-ms-reveal,
        .password-wrapper input::-ms-clear {
            display: none;
        }
        .password-wrapper input::-webkit-credentials-auto-fill-button,
        .password-wrapper input::-webkit-textfield-decoration-container {
            display: none;
        }
        .password-wrapper input {
            -webkit-appearance: none;
            appearance: none;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
            font-size: 18px;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: #ff5722;
        }

        .auth-form button {
            width: 100%;
            background: linear-gradient(135deg, #ff5722, #ff9800);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 25px;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .auth-form button:hover {
            background: #e64a19;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.3);
        }

        .auth-form button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .auth-form a {
            display: block;
            margin-top: 20px;
            color: #ff9800;
            text-decoration: none;
            font-size: 14px;
        }

        .auth-form a:hover {
            text-decoration: underline;
        }

        .error {
            color: #f44336;
            margin: 10px 0;
            font-size: 14px;
            background: #ffebee;
            padding: 10px;
            border-radius: 12px;
        }

        .back-link {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
        }

        .fa-spinner {
            animation: fa-spin 1s infinite linear;
        }

        @keyframes fa-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .auth-form { width: 90%; padding: 30px 20px; margin: 20px; }
        }
    </style>
</head>
<body>
<div class="auth-form">
    <h2><i class="fas fa-lock"></i> Новый пароль</h2>
    <p class="subtitle">Придумайте новый пароль для входа</p>

    <div id="errorMessage" class="error" style="display: none;"></div>

    <form id="resetPasswordForm">
        <div class="password-wrapper">
            <input type="password" id="newPassword" placeholder="Новый пароль (минимум 4 символа)" required>
            <i class="fas fa-eye toggle-password" onclick="togglePassword('newPassword', this)"></i>
        </div>
        <div class="password-wrapper">
            <input type="password" id="confirmPassword" placeholder="Повторите пароль" required>
            <i class="fas fa-eye toggle-password" onclick="togglePassword('confirmPassword', this)"></i>
        </div>
        <button type="submit" id="submitBtn">
            <i class="fas fa-save"></i> Сохранить пароль
        </button>
    </form>

    <div class="back-link">
        <a href="/auth/login">← Вернуться ко входу</a>
    </div>
</div>

<script th:inline="javascript">
    const email = /*[[${email}]]*/ '';
    const code = /*[[${code}]]*/ '';

    function togglePassword(inputId, iconElement) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            iconElement.classList.remove('fa-eye');
            iconElement.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            iconElement.classList.remove('fa-eye-slash');
            iconElement.classList.add('fa-eye');
        }
    }

    document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const errorDiv = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');
        const originalText = submitBtn.innerHTML;

        errorDiv.style.display = 'none';

        if (newPassword !== confirmPassword) {
            errorDiv.textContent = 'Пароли не совпадают';
            errorDiv.style.display = 'block';
            return;
        }

        if (newPassword.length < 4) {
            errorDiv.textContent = 'Пароль должен содержать минимум 4 символа';
            errorDiv.style.display = 'block';
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Сохранение...';

        try {
            const response = await fetch('/auth/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: email,
                    code: code,
                    newPassword: newPassword,
                    confirmPassword: confirmPassword
                })
            });

            const data = await response.json();

            if (data.success) {
                errorDiv.style.color = '#4caf50';
                errorDiv.textContent = 'Пароль успешно изменён! Перенаправление на страницу входа...';
                errorDiv.style.display = 'block';

                setTimeout(() => {
                    window.location.href = '/auth/login?reset=success';
                }, 2000);
            } else {
                errorDiv.style.color = '#ff5722';
                errorDiv.textContent = data.message;
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        } catch (error) {
            errorDiv.textContent = 'Ошибка соединения';
            errorDiv.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
        }
    });
</script>
</body>
</html>
