<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Восстановление пароля</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #fff5eb 0%, #ffe0cc 100%);
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 50%;
            right: -10%;
            width: 40%;
            height: 80%;
            background: radial-gradient(circle, rgba(255, 87, 34, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: 20%;
            left: -10%;
            width: 40%;
            height: 60%;
            background: radial-gradient(circle, rgba(255, 152, 0, 0.04) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .auth-form {
            background: white;
            padding: 40px;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            width: 450px;
            text-align: center;
            position: relative;
            z-index: 2;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-form h2 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #ff5722;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .auth-form h2 i {
            font-size: 28px;
        }

        .auth-form .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .auth-form input {
            width: 100%;
            padding: 14px 16px;
            margin: 10px 0;
            border: 2px solid #ffe0cc;
            border-radius: 16px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            background: #fffaf5;
            box-sizing: border-box;
        }

        .auth-form input:focus {
            outline: none;
            border-color: #ff5722;
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 87, 34, 0.1);
        }

        .auth-form button {
            width: 100%;
            background: linear-gradient(135deg, #ff5722, #ff9800);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 15px;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .auth-form button:hover {
            background: #e64a19;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.3);
        }

        .auth-form button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .auth-form a {
            display: block;
            margin-top: 20px;
            color: #ff9800;
            text-decoration: none;
            font-size: 14px;
        }

        .auth-form a:hover {
            text-decoration: underline;
        }

        .error {
            color: #f44336;
            margin: 10px 0;
            font-size: 14px;
            background: #ffebee;
            padding: 10px;
            border-radius: 12px;
        }

        .success {
            color: #4caf50;
            margin: 10px 0;
            font-size: 14px;
            background: #e8f5e9;
            padding: 10px;
            border-radius: 12px;
        }

        .back-link {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
        }

        .fa-spinner {
            animation: fa-spin 1s infinite linear;
        }

        @keyframes fa-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .auth-form { width: 90%; padding: 30px 20px; margin: 20px; }
        }
    </style>
</head>
<body>
<div class="auth-form">
    <h2><i class="fas fa-key"></i> Восстановление пароля</h2>
    <p class="subtitle">Введите email, указанный при регистрации</p>

    <div id="errorMessage" class="error" style="display: none;"></div>
    <div id="successMessage" class="success" style="display: none;"></div>

    <form id="forgotPasswordForm">
        <input type="email" id="email" name="email" placeholder="Email" required>
        <button type="submit" id="submitBtn">
            <i class="fas fa-paper-plane"></i> Отправить код
        </button>
    </form>

    <div class="back-link">
        <a href="/auth/login">← Вернуться ко входу</a>
    </div>
</div>

<script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');
        const submitBtn = document.getElementById('submitBtn');
        const originalText = submitBtn.innerHTML;

        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Отправка...';

        try {
            const response = await fetch('/auth/api/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });

            const data = await response.json();

            if (data.success) {
                successDiv.textContent = data.message;
                successDiv.style.display = 'block';
                setTimeout(() => {
                    window.location.href = `/auth/verify-code?email=${encodeURIComponent(email)}`;
                }, 1500);
            } else {
                errorDiv.textContent = data.message;
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        } catch (error) {
            errorDiv.textContent = 'Ошибка соединения. Попробуйте позже.';
            errorDiv.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
        }
    });
</script>
</body>
</html>
