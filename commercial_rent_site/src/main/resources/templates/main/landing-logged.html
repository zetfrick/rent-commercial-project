<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Аренда коммерческих помещений</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #fff; border-bottom: 1px solid #ddd; }
        .nav-left { flex-grow: 1; display: flex; align-items: center; justify-content: flex-start; gap: 10px; }
        .nav-left a { color: #333; text-decoration: none; margin-right: 10px; }
        .nav-center { flex-grow: 2; text-align: center; }
        .nav-center h1 { color: #d32f2f; margin: 0; font-size: 2em; }
        .nav-center p { color: #666; margin: 0 0 10px 0; }
        .nav-center .catalog-btn { background: #ff9800; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; } /* Под надписями */
        .nav-right { flex-grow: 1; display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
        .city-dropdown { position: relative; cursor: pointer; color: #333; display: inline-block; margin-left: auto; } /* Справа от "О нас" */
        .current-city { padding: 5px; border: 1px solid #ddd; border-radius: 3px; }
        .city-list {
            position: absolute; top: 100%; left: 0; list-style: none; padding: 0; margin: 0; background: white;
            border: 1px solid #ddd; display: none; z-index: 10; min-width: 150px;
        }
        .city-dropdown:hover .city-list { display: block; }
        .city-list li { padding: 10px; margin: 0; border-bottom: 1px solid #eee; }
        .city-list li:last-child { border-bottom: none; }
        .city-list li:hover { background: #ff9800; color: white; }
        .city-list li.selected { background: #ff9800; color: white; }
        .city-list li a { color: inherit; text-decoration: none; display: block; }
        .user-login { color: #333; }
        .user-login a { color: #ff9800; text-decoration: none; margin-right: 5px; }
        /* Остальные стили (hero-section, etc.) остаются без изменений */
        .hero-section { height: 400px; background-image: url('/images/background.jpeg'); background-size: cover; display: flex; align-items: center; justify-content: center; color: white; text-shadow: 1px 1px 2px black; text-align: center; }
        .hero-content h2 { font-size: 3em; margin: 0; color: #d32f2f; }
        .hero-content p { font-size: 1.5em; margin: 10px 0; }
        .rent-btn { background: #ff9800; color: white; padding: 15px 30px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .catalog-preview { padding: 40px; text-align: center; }
        .catalog-preview h3 { color: #d32f2f; }
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card-placeholder { height: 200px; background: #f0f0f0; border: 1px dashed #ccc; display: flex; align-items: center; justify-content: center; color: #999; border-radius: 5px; }
        .to-catalog-btn { background: #ff9800; color: white; padding: 15px 30px; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px; font-size: 16px; }
        .footer { text-align: center; padding: 20px; background: #333; color: white; margin-top: 40px; }
    </style>
</head>
<body>
<div th:insert="~{fragments/header :: header(currentCity = ${currentCity}, currentUri = ${currentUri})}"></div>
<div class="landing">
    <div class="hero-section">
        <div class="hero-content">
            <h2>Сайт аренды</h2>
            <p>коммерческих помещений</p>
            <button class="rent-btn"
                    th:onclick="'javascript:window.location.href=\'' +
                   @{${#authentication.principal != null ? '/premise/add' : '/auth/register'}} + '\''">
                Сдать в аренду
            </button>
        </div>
    </div>
    <section class="catalog-preview">
        <h3>Популярное в каталоге</h3>
        <div class="cards-grid">
            <div class="card-placeholder">Место для карточки 1</div>
            <div class="card-placeholder">Место для карточки 2</div>
            <div class="card-placeholder">Место для карточки 3</div>
            <div class="card-placeholder">Место для карточки 4</div>
            <div class="card-placeholder">Место для карточки 5</div>
            <div class="card-placeholder">Место для карточки 6</div>
        </div>
        <button class="to-catalog-btn" onclick="window.location.href='/catalog'">Перейти в каталог</button>
    </section>
</div>
<div th:insert="~{fragments/footer :: footer}"></div>
</body>
</html>
