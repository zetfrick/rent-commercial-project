<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аренда коммерческих помещений</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
        }

        /* ====================== HEADER (поверх фона) ====================== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            color: white;
        }

        .nav-left { display: flex; align-items: center; gap: 25px; }
        .nav-left a { color: white; text-decoration: none; font-weight: 500; }
        .nav-left a:hover { color: #ffcc80; }

        /* ========== ИСПРАВЛЕННЫЙ ДРОПДАУН ГОРОДА ========== */
        .city-dropdown {
            position: relative;
            cursor: pointer;
        }

        .current-city {
            padding: 6px 14px;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 6px;
            background: rgba(255,255,255,0.15);
            color: white;
            white-space: nowrap;
        }

        .city-list {
            position: absolute;
            top: calc(100% + 5px);
            left: 0;
            list-style: none;
            padding: 8px 0;
            margin: 0;
            background: rgba(0,0,0,0.95);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            min-width: 180px;
            z-index: 1010;
            display: none;
            backdrop-filter: blur(10px);
        }

        .city-dropdown:hover .city-list {
            display: block;
        }

        .city-list li {
            margin: 0;
            padding: 0;
        }

        .city-list li a {
            padding: 10px 16px;
            display: block;
            color: white;
            text-decoration: none;
            transition: all 0.2s;
            font-size: 14px;
        }

        .city-list li a:hover {
            background: #ff5722;
        }

        .nav-right { display: flex; align-items: center; gap: 20px; }
        .login-link, .register-link {
            color: white;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 6px;
            transition: all 0.3s;
        }
        .register-link { background: #ff5722; }
        .register-link:hover { background: #e64a19; }

        /* ====================== HERO ====================== */
        .hero-section {
            height: 100vh;
            min-height: 700px;
            background: url('/images/background.jpeg') center center no-repeat;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: white;
            text-align: center;
            text-shadow: 0 3px 15px rgba(0,0,0,0.7);
        }
        .hero-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .hero-content h1 {
            font-size: 4.5rem;
            margin: 0 0 20px 0;
            font-weight: 700;
            line-height: 1.05;
        }
        .hero-content p {
            font-size: 1.75rem;
            margin: 0 0 50px 0;
            color: #ffddaa;
        }

        .rent-btn {
            background: #ff5722;
            color: white;
            padding: 18px 50px;
            border: none;
            border-radius: 50px;
            font-size: 1.35rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .rent-btn:hover {
            background: #e64a19;
            transform: translateY(-5px);
        }

        /* ====================== НОВОЕ В КАТАЛОГЕ ====================== */
        .new-section {
            padding: 100px 20px 80px;
            background: #f8f9fa;
            text-align: center;
        }
        .new-section h2 {
            font-size: 2.9rem;
            color: #d32f2f;
            margin-bottom: 60px;
        }

        .premises-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .premise-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }
        .premise-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .premise-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-body { padding: 18px; }
        .card-body h3 { margin: 0 0 8px 0; font-size: 1.35rem; color: #333; }
        .card-body .info { color: #666; font-size: 0.95rem; margin: 4px 0; }
        .price {
            font-size: 1.4rem;
            font-weight: bold;
            color: #d32f2f;
            margin: 12px 0 15px 0;
        }

        .btn-detail {
            display: inline-block;
            background: #ff9800;
            color: white;
            padding: 10px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-detail:hover { background: #f57c00; }

        .no-premises {
            font-size: 1.3rem;
            color: #888;
            padding: 80px 20px;
        }

        /* ====================== FULLSCREEN ====================== */
        #fullscreen {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }

        #fullImg {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }

        @media (max-width: 768px) {
            .hero-content h1 { font-size: 3.2rem; }
            .premises-grid { grid-template-columns: 1fr; }
            .city-list {
                min-width: 150px;
                right: 0;
                left: auto;
            }
        }
    </style>
</head>
<body>

<!-- Header с исправленным дропдауном городов -->
<div th:insert="~{fragments/header :: header(currentCity = ${currentCity}, currentUri = ${currentUri})}"></div>

<!-- Hero -->
<div class="hero-section">
    <div class="hero-overlay"></div>
    <div class="hero-content">
        <h1>Аренда коммерческих помещений</h1>
        <p>Сдавайте и арендуйте офисы, склады, торговые площади быстро и выгодно</p>

        <div class="auth-buttons" style="margin-top: 30px;">
            <button onclick="window.location.href='/auth/login'" class="login-btn"
                    style="background:#ff5722; color:white; padding:16px 40px; border:none; border-radius:50px; margin-right:15px; font-size:1.2rem; cursor:pointer;">
                Вход
            </button>
            <button onclick="window.location.href='/auth/register'" class="register-btn"
                    style="background:#ff9800; color:white; padding:16px 40px; border:none; border-radius:50px; font-size:1.2rem; cursor:pointer;">
                Регистрация
            </button>
        </div>
    </div>
</div>

<!-- Новое в каталоге -->
<section class="new-section">
    <h2>Новое в каталоге</h2>

    <div th:if="${latestPremises != null and !latestPremises.isEmpty()}" class="premises-grid">
        <div th:each="premise : ${latestPremises}" class="premise-card">
            <img th:src="${premise.photoPaths != null and !premise.photoPaths.isEmpty() ?
                          '/uploads/' + premise.photoPaths[0] : '/images/no-image.jpg'}"
                 alt="Фото помещения">

            <div class="card-body">
                <h3 th:text="${premise.getTypeInRussian() != null ? premise.getTypeInRussian() : premise.type}"></h3>
                <div class="info" th:text="${premise.city}"></div>
                <div class="price" th:text="${premise.priceWeekday} + ' ₽ / сутки'"></div>

                <a th:href="@{/premise/{id}(id=${premise.id})}" class="btn-detail">Подробнее →</a>
            </div>
        </div>
    </div>

    <div th:if="${latestPremises == null or latestPremises.isEmpty()}" class="no-premises">
        Пока нет добавленных помещений
    </div>

    <a href="/catalog" style="margin-top: 60px; display: inline-block; background: #ff9800; color: white; padding: 14px 40px; border-radius: 50px; text-decoration: none; font-weight: bold;">
        Перейти в полный каталог
    </a>
</section>

<!-- Fullscreen просмотр -->
<div id="fullscreen" onclick="this.style.display='none'">
    <img id="fullImg" alt="Полноэкранное фото">
</div>

<div th:insert="~{fragments/footer :: footer}"></div>

<script>
    function openFullscreen(src) {
        document.getElementById('fullImg').src = src;
        document.getElementById('fullscreen').style.display = 'flex';
    }
</script>

</body>
</html>
