<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои чаты - RentApp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <!-- SockJS и STOMP клиенты для WebSocket -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            padding-top: 80px;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .chats-list {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #f0f0f0;
            text-decoration: none;
            color: #333;
            transition: background 0.2s;
            position: relative;
        }

        .chat-item:hover {
            background: #fef7f2;
        }

        .chat-item.pinned {
            background: #fffdf5;
            border-left: 4px solid #ff9800;
        }

        .chat-avatar {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #ff5722, #ff9800);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            flex-shrink: 0;
            position: relative;
        }

        .chat-avatar i {
            font-size: 24px;
            color: white;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .chat-premise {
            font-size: 12px;
            color: #ff5722;
            background: #fff0e8;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
        }

        .chat-preview {
            font-size: 13px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-time {
            font-size: 11px;
            color: #aaa;
            margin-left: 10px;
            flex-shrink: 0;
            text-align: right;
        }

        .unread-badge {
            background: #ff5722;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 20px;
            min-width: 20px;
            text-align: center;
        }

        .pin-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            color: #ccc;
            padding: 5px;
            margin-left: 5px;
            transition: all 0.2s;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            z-index: 10;
            position: relative;
        }

        .pin-btn:hover {
            background: #f0f0f0;
            color: #ff9800;
        }

        .pin-btn.pinned {
            color: #ff9800;
        }

        .pin-btn.pinned:hover {
            color: #e65100;
        }

        .pinned-header {
            background: #fff8e1;
            padding: 12px 20px;
            font-size: 13px;
            color: #ff9800;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #ffe0b3;
        }

        .pinned-header i {
            font-size: 14px;
        }

        .empty-chats {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 20px;
        }

        .empty-chats i {
            font-size: 64px;
            color: #ddd;
            margin-bottom: 16px;
        }

        .empty-chats p {
            color: #999;
            margin-bottom: 20px;
        }

        .empty-chats a {
            background: linear-gradient(135deg, #ff5722, #ff9800);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s;
        }

        .empty-chats a:hover {
            transform: translateY(-2px);
        }

        .connection-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 10px;
            background: #4caf50;
            color: white;
            z-index: 1000;
        }

        .connection-status.disconnected {
            background: #f44336;
        }

        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(100px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        @media (max-width: 600px) {
            .chat-preview { max-width: 200px; }
            .chat-item { padding: 15px; }
            .chat-avatar { width: 45px; height: 45px; }
            .chat-avatar i { font-size: 20px; }
            .chat-name { font-size: 14px; }
            .pin-btn { width: 26px; height: 26px; font-size: 12px; }
        }

        @media (max-width: 768px) {
            .header { padding: 8px 16px; flex-wrap: wrap; gap: 8px; }
            .nav-left { flex-wrap: wrap; gap: 12px; }
        }
    </style>
</head>
<body>
<div th:insert="~{fragments/header :: header(
    currentUri=${currentUri},
    headerClass='hd-header-fixed'
)}"></div>

<div class="container">
    <div class="chats-list" id="chatsList"></div>
</div>

<div id="connectionStatus" class="connection-status">🔄 Инициализация...</div>

<script th:inline="javascript">
    // Константы из Thymeleaf
    const chatsData = /*[[${chats}]]*/ [];
    const currentUsername = /*[[${#authentication.name}]]*/ null;

    // WebSocket переменные
    let stompClient = null;
    let isWsConnected = false;
    let reconnectAttempts = 0;
    let maxReconnectAttempts = 5;
    let pollingInterval = null;
    let isPolling = false;
    let lastUpdateHash = '';
    let currentUserId = null;

    const PINNED_CHATS_KEY = 'pinnedChats';

    // Получение ID текущего пользователя
    async function getCurrentUserId() {
        try {
            const response = await fetch('/api/auth/current-user');
            if (response.ok) {
                const data = await response.json();
                currentUserId = data.id;
                return currentUserId;
            }
        } catch (error) {
            console.error('Error getting current user ID:', error);
        }
        return null;
    }

    function getChatKey(chat) {
        return `${chat.user.id}_${chat.premiseId || '0'}`;
    }

    function loadPinnedChats() {
        const pinned = localStorage.getItem(PINNED_CHATS_KEY);
        if (pinned) {
            try {
                return new Set(JSON.parse(pinned));
            } catch (e) {
                return new Set();
            }
        }
        return new Set();
    }

    function savePinnedChats(pinnedSet) {
        localStorage.setItem(PINNED_CHATS_KEY, JSON.stringify(Array.from(pinnedSet)));
    }

    function togglePin(chatId, event) {
        event.stopPropagation();
        event.preventDefault();

        const pinnedSet = loadPinnedChats();
        if (pinnedSet.has(chatId)) {
            pinnedSet.delete(chatId);
        } else {
            pinnedSet.add(chatId);
        }
        savePinnedChats(pinnedSet);
        loadChats(true);
    }

    function generateChatsHash(chats) {
        if (!chats || chats.length === 0) return 'empty';
        const pinnedSet = loadPinnedChats();
        return chats.map(chat =>
            `${chat.user.id}_${chat.premiseId}_${chat.lastMessage}_${chat.lastMessageTime}_${chat.unreadCount}_${pinnedSet.has(getChatKey(chat))}`
        ).join('|');
    }

    function formatTime(timeStr) {
        const date = new Date(timeStr);
        const now = new Date();
        const diff = now - date;

        if (diff < 24 * 60 * 60 * 1000) {
            return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        } else if (diff < 7 * 24 * 60 * 60 * 1000) {
            return date.toLocaleDateString('ru-RU', { weekday: 'short' });
        } else {
            return date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
        }
    }

    function stripHtml(html) {
        if (!html) return '';
        const temp = document.createElement('div');
        temp.innerHTML = html;
        return temp.textContent || temp.innerText || '';
    }

    function sortChats(chats) {
        const pinnedSet = loadPinnedChats();
        return [...chats].sort((a, b) => {
            const aKey = getChatKey(a);
            const bKey = getChatKey(b);
            const aPinned = pinnedSet.has(aKey);
            const bPinned = pinnedSet.has(bKey);

            if (aPinned && !bPinned) return -1;
            if (!aPinned && bPinned) return 1;
            return new Date(b.lastMessageTime) - new Date(a.lastMessageTime);
        });
    }

    function renderChats(chats) {
        const container = document.getElementById('chatsList');
        if (!container) return;

        if (!chats || chats.length === 0) {
            container.innerHTML = `
                <div class="empty-chats">
                    <i class="fas fa-comment-dots"></i>
                    <p>У вас пока нет активных чатов</p>
                    <a href="/catalog">Найти помещение</a>
                </div>
            `;
            return;
        }

        const pinnedSet = loadPinnedChats();
        const sortedChats = sortChats(chats);

        const pinnedChats = sortedChats.filter(chat => pinnedSet.has(getChatKey(chat)));
        const normalChats = sortedChats.filter(chat => !pinnedSet.has(getChatKey(chat)));

        let html = '';

        if (pinnedChats.length > 0) {
            html += `
                <div class="pinned-header">
                    <i class="fas fa-thumbtack"></i>
                    <span>Закреплённые чаты</span>
                </div>
            `;
            for (const chat of pinnedChats) {
                html += renderChatItem(chat, true);
            }
        }

        if (normalChats.length > 0) {
            if (pinnedChats.length > 0) {
                html += `<div style="border-top: 8px solid #f0f0f0;"></div>`;
            }
            for (const chat of normalChats) {
                html += renderChatItem(chat, false);
            }
        }

        container.innerHTML = html;

        document.querySelectorAll('.pin-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const chatId = btn.getAttribute('data-chat-id');
                if (chatId) {
                    togglePin(chatId, e);
                }
            });
        });

        lastUpdateHash = generateChatsHash(chats);
    }

    function renderChatItem(chat, isPinned) {
        const userName = (chat.user.firstName && chat.user.firstName !== '')
            ? `${chat.user.firstName} ${chat.user.lastName || ''}`
            : chat.user.login;

        const premiseBadge = chat.premise ? `<span class="chat-premise">📌 ${escapeHtml(chat.premise.typeInRussian)}</span>` : '';
        const unreadBadge = chat.unreadCount > 0 ? `<span class="unread-badge">${chat.unreadCount}</span>` : '';
        const chatUrl = chat.premiseId
            ? `/chats/with/${encodeURIComponent(chat.user.login)}/premise/${chat.premiseId}`
            : `/chats/with/${encodeURIComponent(chat.user.login)}`;
        const chatKey = getChatKey(chat);

        let previewText = chat.lastMessage || '';
        if (previewText.includes('<strong>') || previewText.includes('<br>')) {
            previewText = stripHtml(previewText);
        } else {
            previewText = escapeHtml(previewText);
        }

        if (previewText.length > 60) {
            previewText = previewText.substring(0, 57) + '...';
        }

        return `
            <a href="${chatUrl}" class="chat-item ${isPinned ? 'pinned' : ''}" data-chat-id="${chatKey}" style="text-decoration: none; display: flex; align-items: center;">
                <div class="chat-avatar">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div class="chat-info">
                    <div class="chat-name">
                        <span>${escapeHtml(userName)}</span>
                        ${premiseBadge}
                        ${unreadBadge}
                        <button class="pin-btn ${isPinned ? 'pinned' : ''}" data-chat-id="${chatKey}" title="${isPinned ? 'Открепить чат' : 'Закрепить чат'}">
                            <i class="fas fa-thumbtack"></i>
                        </button>
                    </div>
                    <div class="chat-preview">${previewText}</div>
                </div>
                <div class="chat-time">
                    <span>${formatTime(chat.lastMessageTime)}</span>
                </div>
            </a>
        `;
    }

    function updateConnectionStatus(connected) {
        const statusDiv = document.getElementById('connectionStatus');
        if (connected) {
            statusDiv.textContent = '🟢 WebSocket';
            statusDiv.classList.remove('disconnected');
        } else {
            statusDiv.textContent = '🔴 HTTP режим';
            statusDiv.classList.add('disconnected');
        }
    }

    // Подключение WebSocket для мгновенных обновлений
    async function connectWebSocket() {
        if (!currentUsername) {
            currentUsername = await getCurrentUserId();
            if (!currentUsername) return;
        }

        const socket = new SockJS('/ws-chat');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({},
            function(frame) {
                isWsConnected = true;
                reconnectAttempts = 0;
                updateConnectionStatus(true);

                // Подписываемся на новые сообщения
                const subscribeUrl = '/user/' + currentUsername + '/queue/messages';
                stompClient.subscribe(subscribeUrl, function(response) {
                    const message = JSON.parse(response.body);
                    // Обновляем список чатов при новом сообщении
                    loadChats(true);
                });

                // Подписываемся на уведомления о прочтении
                stompClient.subscribe('/user/' + currentUsername + '/queue/read', function() {
                    loadChats(true);
                });
            },
            function(error) {
                isWsConnected = false;
                updateConnectionStatus(false);

                if (reconnectAttempts < maxReconnectAttempts) {
                    reconnectAttempts++;
                    const delay = 3000 * reconnectAttempts;
                    setTimeout(connectWebSocket, delay);
                }
            }
        );
    }

    async function loadChats(force = false) {
        if (isPolling && !force) return;
        isPolling = true;

        try {
            const response = await fetch('/chats/api/chats');
            if (response.ok) {
                const newChats = await response.json();
                const newHash = generateChatsHash(newChats);

                if (newHash !== lastUpdateHash || force) {
                    renderChats(newChats);
                }
            }
        } catch (error) {
            console.error('Error loading chats:', error);
        } finally {
            isPolling = false;
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // Инициализация
    document.addEventListener('DOMContentLoaded', async function() {
        await getCurrentUserId();

        if (chatsData && chatsData.length > 0) {
            renderChats(chatsData);
        } else {
            renderChats([]);
            loadChats();
        }

        // Подключаем WebSocket
        connectWebSocket();

        // Polling как резервный канал (раз в 30 секунд)
        pollingInterval = setInterval(() => {
            if (!isWsConnected) {
                loadChats(false);
            }
        }, 30000);
    });

    window.addEventListener('beforeunload', function() {
        if (pollingInterval) {
            clearInterval(pollingInterval);
        }
        if (stompClient) {
            stompClient.disconnect();
        }
    });
</script>
</body>
</html>
