<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактирование помещения</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f8f9fa;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            color: #ff5722;
        }

        .form-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #ff5722;
            box-shadow: 0 0 0 3px rgba(255,87,34,0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Выпадающий список с множественным выбором */
        .multiselect-dropdown {
            position: relative;
            width: 100%;
            background: white;
            border-radius: 12px;
            border: 1px solid #ddd;
        }

        .dropdown-header {
            position: relative;
            padding: 8px 12px;
            background: white;
            border-radius: 12px;
            cursor: pointer;
        }

        .search-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            box-sizing: border-box;
        }

        .search-input:focus {
            outline: none;
            border-color: #ff5722;
            box-shadow: 0 0 0 2px rgba(255,87,34,0.2);
        }

        .selected-count {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            color: #666;
            background: #f5f5f5;
            padding: 4px 8px;
            border-radius: 20px;
        }

        .dropdown-list {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 300px;
            overflow-y: auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 1000;
            margin-top: 5px;
        }

        .dropdown-list.open {
            display: block;
        }

        .dropdown-options {
            padding: 8px 0;
        }

        .dropdown-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #f0f0f0;
        }

        .dropdown-option:hover {
            background: #fff0e8;
        }

        .dropdown-option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
            cursor: pointer;
        }

        .dropdown-option label {
            flex: 1;
            margin: 0;
            cursor: pointer;
            color: #333;
            font-weight: normal;
        }

        .selected-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            padding: 0;
        }

        .selected-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #ff5722, #ff9800);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            animation: fadeIn 0.2s ease;
        }

        .selected-tag .remove-tag {
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            padding: 0 4px;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .selected-tag .remove-tag:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.2);
        }

        .clear-all-btn {
            background: #ff5722;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
            transition: 0.2s;
        }

        .clear-all-btn:hover {
            background: #e64a19;
            transform: translateY(-1px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .readonly-field {
            background: #f5f5f5;
            padding: 12px 15px;
            border-radius: 12px;
            color: #666;
            border: 1px solid #eee;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-save {
            background: #ff5722;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-save:hover {
            background: #e64a19;
            transform: translateY(-2px);
        }

        .btn-cancel {
            background: #f5f5f5;
            color: #666;
            border: none;
            padding: 14px 30px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            transition: all 0.3s;
        }

        .btn-cancel:hover {
            background: #e0e0e0;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #ff5722;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        hr {
            margin: 25px 0;
            border: none;
            border-top: 1px solid #eee;
        }

        .info-note {
            background: #fff3e0;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #ff9800;
        }

        @media (max-width: 768px) {
            .container { padding: 20px; }
            .form-card { padding: 20px; }
            .button-group { flex-direction: column; }
            .btn-save, .btn-cancel { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <a href="/premise/1" th:href="@{/premise/{id}(id=${premise.id})}" class="back-link">
        <i class="fas fa-arrow-left"></i> Вернуться к объявлению
    </a>

    <h1><i class="fas fa-edit"></i> Редактирование помещения</h1>

    <div class="info-note">
        <i class="fas fa-info-circle"></i> Вы можете редактировать только: тип помещения, площадь, вместительность, удобства, описание, доп. платежи и важную информацию.
    </div>

    <div class="form-card">
        <form id="editForm" th:action="@{/premise/{id}/edit(id=${premise.id})}" method="post">
            <!-- Тип помещения -->
            <div class="form-group">
                <label><i class="fas fa-building"></i> Тип помещения <span style="color:#ff5722;">*</span></label>
                <select name="type" required>
                    <option value="">— Выберите тип —</option>
                    <option th:each="t : ${types}"
                            th:value="${t}"
                            th:text="${typeInRussian.get(t)}"
                            th:selected="${premise.type == t}"></option>
                </select>
            </div>

            <!-- Площадь -->
            <div class="form-group">
                <label><i class="fas fa-arrows-alt"></i> Площадь (м²) <span style="color:#ff5722;">*</span></label>
                <input type="number" name="area" th:value="${premise.area}" min="1" required>
            </div>

            <!-- Вместимость -->
            <div class="form-group">
                <label><i class="fas fa-users"></i> Вместимость (человек) <span style="color:#ff5722;">*</span></label>
                <input type="number" name="capacity" th:value="${premise.capacity}" min="1" required>
            </div>

            <!-- Удобства - выпадающий список с поиском -->
            <div class="form-group">
                <label><i class="fas fa-star-of-life"></i> Оснащение и удобства</label>
                <div class="multiselect-dropdown">
                    <div class="dropdown-header">
                        <input type="text" id="amenitiesSearch" class="search-input" placeholder="Поиск удобств..." autocomplete="off">
                        <div class="selected-count" id="selectedCount">Выбрано: 0</div>
                    </div>
                    <div id="amenitiesDropdown" class="dropdown-list">
                        <div class="dropdown-options" id="amenitiesOptions">
                            <!-- Опции будут добавлены через JavaScript -->
                        </div>
                    </div>
                    <div class="selected-items" id="selectedAmenities"></div>
                </div>
            </div>

            <hr>

            <!-- Описание -->
            <div class="form-group">
                <label><i class="fas fa-info-circle"></i> Описание помещения</label>
                <textarea name="description" th:text="${premise.description}"></textarea>
            </div>

            <!-- Дополнительные платежи -->
            <div class="form-group">
                <label><i class="fas fa-receipt"></i> Дополнительные платежи</label>
                <textarea name="extraFees" th:text="${premise.extraFees}"></textarea>
            </div>

            <!-- Важная информация -->
            <div class="form-group">
                <label><i class="fas fa-exclamation-triangle"></i> Важная информация</label>
                <textarea name="importantInfo" th:text="${premise.importantInfo}"></textarea>
            </div>

            <hr>

            <!-- Неизменяемые поля для информации -->
            <div class="form-group">
                <label><i class="fas fa-map-marker-alt"></i> Адрес</label>
                <div class="readonly-field" th:text="${premise.region} + ', ' + ${premise.city} + ', ' + ${premise.street} + ' ' + ${premise.building}"></div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-tag"></i> Цены</label>
                <div class="readonly-field">
                    Будни: <span th:text="${premise.priceWeekday} + ' ₽'"></span><br>
                    <span th:if="${premise.priceWeekend != null}">Выходные: <span th:text="${premise.priceWeekend} + ' ₽'"></span><br></span>
                    <span th:if="${premise.priceHoliday != null}">Праздники: <span th:text="${premise.priceHoliday} + ' ₽'"></span></span>
                </div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-calendar-alt"></i> Доступность</label>
                <div class="readonly-field">
                    <span th:text="${#temporals.format(premise.availableFrom, 'dd.MM.yyyy')}"></span> —
                    <span th:text="${#temporals.format(premise.availableTo, 'dd.MM.yyyy')}"></span>
                </div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-user"></i> Контактные данные</label>
                <div class="readonly-field">
                    <span th:text="${premise.contactFirstName} + ' ' + ${premise.contactLastName}"></span><br>
                    <span th:text="${premise.contactPhone}"></span>
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-save"><i class="fas fa-save"></i> Сохранить изменения</button>
                <a th:href="@{/premise/{id}(id=${premise.id})}" class="btn-cancel">Отмена</a>
            </div>
        </form>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    window.amenitiesList = /*[[${amenities}]]*/ [];
    window.amenityRussianMap = /*[[${amenityInRussian}]]*/ {};
    window.existingAmenities = /*[[${premise.amenities}]]*/ [];
    /*]]>*/
</script>

<script>
    // ==================== ВЫПАДАЮЩИЙ СПИСОК С ПОИСКОМ ДЛЯ УДОБСТВ ====================
    class AmenitiesDropdown {
        constructor(amenities, amenityRussian, existingAmenities) {
            this.amenities = amenities;
            this.amenityRussian = amenityRussian;
            this.selectedAmenities = new Set(existingAmenities || []);
            this.filteredAmenities = [...amenities];
            this.init();
        }

        init() {
            this.renderOptions();
            this.attachEvents();
            this.updateSelectedTags();
            this.updateSelectedCount();
        }

        renderOptions() {
            const container = document.getElementById('amenitiesOptions');
            if (!container) return;

            if (this.filteredAmenities.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">Ничего не найдено</div>';
                return;
            }

            container.innerHTML = this.filteredAmenities.map(amenity => `
                <div class="dropdown-option" data-value="${amenity}">
                    <input type="checkbox"
                           id="amenity_${amenity}"
                           value="${amenity}"
                           ${this.selectedAmenities.has(amenity) ? 'checked' : ''}>
                    <label for="amenity_${amenity}">${this.amenityRussian[amenity] || amenity}</label>
                </div>
            `).join('');

            // Добавляем обработчики для новых опций
            container.querySelectorAll('.dropdown-option').forEach(option => {
                const checkbox = option.querySelector('input[type="checkbox"]');
                const value = option.dataset.value;

                checkbox.addEventListener('change', (e) => {
                    e.stopPropagation();
                    if (checkbox.checked) {
                        this.selectedAmenities.add(value);
                    } else {
                        this.selectedAmenities.delete(value);
                    }
                    this.updateSelectedTags();
                    this.updateHiddenInput();
                    this.updateSelectedCount();
                    this.renderOptions();
                });

                option.addEventListener('click', (e) => {
                    if (e.target !== checkbox && !option.contains(e.target.closest('label'))) {
                        checkbox.checked = !checkbox.checked;
                        const event = new Event('change', { bubbles: true });
                        checkbox.dispatchEvent(event);
                    }
                });
            });
        }

        updateSelectedTags() {
            const container = document.getElementById('selectedAmenities');
            if (!container) return;

            if (this.selectedAmenities.size === 0) {
                container.innerHTML = '';
                return;
            }

            const tags = Array.from(this.selectedAmenities).map(amenity => `
                <span class="selected-tag" data-value="${amenity}">
                    ${this.amenityRussian[amenity] || amenity}
                    <span class="remove-tag" data-value="${amenity}">×</span>
                </span>
            `).join('');

            container.innerHTML = tags;

            // Добавляем обработчики для удаления тегов
            container.querySelectorAll('.remove-tag').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const value = btn.dataset.value;
                    this.selectedAmenities.delete(value);
                    this.updateSelectedTags();
                    this.updateHiddenInput();
                    this.updateSelectedCount();
                    this.renderOptions();
                });
            });
        }

        updateHiddenInput() {
            // Создаем или находим контейнер для скрытых полей
            let hiddenContainer = document.getElementById('hiddenAmenitiesContainer');

            if (!hiddenContainer) {
                hiddenContainer = document.createElement('div');
                hiddenContainer.id = 'hiddenAmenitiesContainer';
                hiddenContainer.style.display = 'none';
                const form = document.getElementById('editForm');
                if (form) {
                    form.appendChild(hiddenContainer);
                }
            }

            // Очищаем контейнер
            hiddenContainer.innerHTML = '';

            // Создаем скрытые инпуты для выбранных удобств
            Array.from(this.selectedAmenities).forEach(amenity => {
                const hiddenInput = document.createElement('input');
                hiddenInput.type = 'hidden';
                hiddenInput.name = 'amenities';
                hiddenInput.value = amenity;
                hiddenContainer.appendChild(hiddenInput);
            });
        }

        updateSelectedCount() {
            const countElement = document.getElementById('selectedCount');
            if (countElement) {
                countElement.textContent = `Выбрано: ${this.selectedAmenities.size}`;
            }
        }

        filter(searchTerm) {
            if (!searchTerm || searchTerm.trim() === '') {
                this.filteredAmenities = [...this.amenities];
            } else {
                const term = searchTerm.toLowerCase().trim();
                this.filteredAmenities = this.amenities.filter(amenity => {
                    const russianName = this.amenityRussian[amenity] || amenity;
                    return amenity.toLowerCase().includes(term) ||
                           russianName.toLowerCase().includes(term);
                });
            }
            this.renderOptions();
        }

        attachEvents() {
            const searchInput = document.getElementById('amenitiesSearch');
            const dropdown = document.getElementById('amenitiesDropdown');
            const header = document.querySelector('.dropdown-header');
            const multiselect = document.querySelector('.multiselect-dropdown');

            // Поиск с debounce
            let searchTimeout;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    this.filter(e.target.value);
                }, 300);
            });

            // Открытие/закрытие дропдауна
            const toggleDropdown = (e) => {
                e.stopPropagation();
                dropdown.classList.toggle('open');
                if (dropdown.classList.contains('open')) {
                    searchInput.focus();
                    this.filter(searchInput.value);
                }
            };

            header.addEventListener('click', toggleDropdown);

            searchInput.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!dropdown.classList.contains('open')) {
                    dropdown.classList.add('open');
                    searchInput.focus();
                    this.filter(searchInput.value);
                }
            });

            // Закрытие при клике вне компонента
            document.addEventListener('click', (e) => {
                if (!multiselect || !multiselect.contains(e.target)) {
                    dropdown.classList.remove('open');
                }
            });

            // Останавливаем всплытие при клике внутри дропдауна
            dropdown.addEventListener('click', (e) => {
                e.stopPropagation();
            });

            // Очистка всех выбранных удобств
            const clearAllBtn = document.createElement('button');
            clearAllBtn.textContent = 'Очистить все';
            clearAllBtn.className = 'clear-all-btn';
            clearAllBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                this.selectedAmenities.clear();
                this.updateSelectedTags();
                this.updateHiddenInput();
                this.updateSelectedCount();
                this.renderOptions();
            });

            const dropdownContainer = document.querySelector('.multiselect-dropdown');
            if (dropdownContainer && !dropdownContainer.querySelector('.clear-all-btn')) {
                dropdownContainer.appendChild(clearAllBtn);
            }
        }
    }

    // Инициализация после загрузки страницы
    document.addEventListener('DOMContentLoaded', () => {
        const amenities = window.amenitiesList || [];
        const amenityRussian = window.amenityRussianMap || {};
        const existingAmenities = window.existingAmenities || [];

        if (amenities.length > 0) {
            window.amenitiesDropdown = new AmenitiesDropdown(amenities, amenityRussian, existingAmenities);
        }
    });

    // Перед отправкой формы обновляем скрытые поля
    document.getElementById('editForm')?.addEventListener('submit', function(e) {
        if (window.amenitiesDropdown) {
            window.amenitiesDropdown.updateHiddenInput();
        }
    });
</script>

</body>
</html>
