<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>О нас</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #fff; border-bottom: 1px solid #ddd; }
        .nav-left { flex-grow: 1; display: flex; align-items: center; justify-content: flex-start; gap: 10px; }
        .nav-left a { color: #333; text-decoration: none; margin-right: 10px; }
        .nav-center { flex-grow: 2; text-align: center; }
        .nav-center h1 { color: #d32f2f; margin: 0; font-size: 2em; }
        .nav-center p { color: #666; margin: 0 0 10px 0; }
        .nav-center .catalog-btn { background: #ff9800; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; } /* Под надписями */
        .nav-right { flex-grow: 1; display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
        .city-dropdown { position: relative; cursor: pointer; color: #333; display: inline-block; margin-left: auto; } /* Справа от "О нас" */
        .current-city { padding: 5px; border: 1px solid #ddd; border-radius: 3px; }
        .city-list {
            position: absolute; top: 100%; left: 0; list-style: none; padding: 0; margin: 0; background: white;
            border: 1px solid #ddd; display: none; z-index: 10; min-width: 150px;
        }
        .city-dropdown:hover .city-list { display: block; }
        .city-list li { padding: 10px; margin: 0; border-bottom: 1px solid #eee; }
        .city-list li:last-child { border-bottom: none; }
        .city-list li:hover { background: #ff9800; color: white; }
        .city-list li.selected { background: #ff9800; color: white; }
        .city-list li a { color: inherit; text-decoration: none; display: block; }
        .user-login { color: #333; }
        .user-login a { color: #ff9800; text-decoration: none; margin-right: 5px; }
        .page-content { padding: 40px; text-align: center; max-width: 1200px; margin: 0 auto; }
        .page-content h2 { color: #d32f2f; font-size: 2.5em; }
        .page-content p { font-size: 18px; color: #666; line-height: 1.6; }
        .footer { text-align: center; padding: 20px; background: #333; color: white; margin-top: 40px; }
    </style>
</head>
<body>
<div th:insert="~{fragments/header :: header(currentCity = ${currentCity}, currentUri = ${currentUri})}"></div>
<div class="page-content">
    <h2>О нас</h2>
    <p>Мы — платформа для аренды коммерческих помещений в вашем городе. Наша цель — соединить бизнес с идеальными пространствами для роста. Страница в разработке.</p>
</div>
<div th:insert="~{fragments/footer :: footer}"></div>
</body>
</html>
