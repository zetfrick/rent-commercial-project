<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light only">
    <title>Каталог помещений в аренду</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        a { text-decoration: none; }

        /* ====================== ВЕРХНЯЯ ПАНЕЛЬ ====================== */
        .top-bar {
            background: white;
            padding: 15px 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .left-side { display: flex; align-items: center; gap: 25px; }
        .location { font-weight: 600; color: #ff5722; font-size: 19px; }
        .back-home {
            background: #ff5722;
            color: white;
            padding: 10px 28px;
            border-radius: 30px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .back-home:hover { background: #e64a19; transform: translateY(-2px); }

        /* Кнопка по центру */
        .center-rent-btn {
            background: #ff5722;
            color: white;
            padding: 12px 32px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,87,34,0.3);
        }
        .center-rent-btn:hover {
            background: #e64a19;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,87,34,0.4);
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .phone { display: flex; align-items: center; gap: 8px; font-weight: 500; color: #333; }
        .phone a { color: #ff5722; font-weight: 600; }

        /* Профиль пользователя */
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f5f5f5;
            padding: 5px 8px 5px 5px;
            border-radius: 50px;
            border: 1px solid #eee;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #333;
            padding: 4px 14px 4px 8px;
            border-radius: 50px;
            transition: all 0.3s ease;
        }
        .user-info:hover { background: #fff0e8; }
        .user-avatar {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #ff5722, #ff9800);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(255,87,34,0.3);
        }
        .user-name {
            font-weight: 600;
            font-size: 15px;
            max-width: 170px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .logout-btn {
            background: #ff5722;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .logout-btn:hover {
            background: #e64a19;
            transform: translateY(-1px);
        }
        .auth-buttons a {
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-login { background: transparent; color: #ff5722; border: 2px solid #ff5722; }
        .btn-login:hover { background: #ff5722; color: white; }
        .btn-register { background: #ff5722; color: white; }
        .btn-register:hover { background: #e64a19; }

        /* ====================== ФИЛЬТРЫ ====================== */
        .filters {
            background: white;
            padding: 20px 25px;
            margin: 20px auto;
            max-width: 1400px;
            border-radius: 16px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.08);
        }

        .filters-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .filters-left {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .filter-group {
            position: relative;
            flex: 1;
            min-width: 130px;
        }

        .filter-group label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
            display: block;
            font-weight: 500;
        }

        .filter-group input,
        .filter-group select {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 13px;
            width: 100%;
            outline: none;
            transition: all 0.3s;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            border-color: #ff5722;
            box-shadow: 0 0 0 2px rgba(255,87,34,0.15);
        }

        /* Мультиселект */
        .multi-select {
            position: relative;
        }

        .multi-select-trigger {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            background: white;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 42px;
            transition: all 0.3s;
        }

        .multi-select-trigger:hover {
            border-color: #ff5722;
        }

        .multi-select-trigger:after {
            content: '▼';
            font-size: 10px;
            transition: transform 0.3s;
            color: #999;
        }

        .multi-select-trigger.active:after {
            transform: rotate(180deg);
        }

        .multi-select-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #eee;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            margin-top: 5px;
            max-height: 280px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            padding: 5px 0;
        }

        .multi-select-dropdown.show {
            display: block;
        }

        .dropdown-search {
            padding: 8px 12px;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            background: white;
            z-index: 1;
        }
        .dropdown-search input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 12px;
            outline: none;
        }

        .option-item {
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
            font-size: 13px;
            transition: background 0.2s;
        }
        .option-item:hover {
            background: #fff5f0;
        }
        .option-item input[type="checkbox"] {
            accent-color: #ff5722;
            width: 16px;
            height: 16px;
            cursor: pointer;
            pointer-events: none;
        }
        .option-item span {
            flex: 1;
            cursor: pointer;
            color: #333;
            pointer-events: none;
        }
        .no-results {
            padding: 12px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }

        /* Кнопки */
        .filters-buttons {
            display: flex;
            gap: 10px;
            min-width: auto;
        }

        .reset-btn, .search-btn {
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .reset-btn {
            background: #f5f5f5;
            color: #666;
            border: 1px solid #ddd;
        }
        .reset-btn:hover {
            background: #e0e0e0;
            border-color: #ff5722;
            color: #ff5722;
        }
        .search-btn {
            background: #ff5722;
            color: white;
            border: none;
        }
        .search-btn:hover { background: #e64a19; transform: translateY(-1px); }

        /* ====================== КАТАЛОГ ====================== */
        .catalog-grid {
            max-width: 1400px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 30px;
            padding: 0 20px;
        }

        .premise-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        .premise-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(255,152,0,0.2);
        }

        .photos-slider {
            position: relative;
            height: 260px;
            overflow: hidden;
            cursor: grab;
            background: #f0f0f0;
        }

        .photos-container {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .photo-item {
            min-width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            z-index: 20;
            opacity: 0;
            transition: all 0.2s ease;
        }

        .photos-slider:hover .slider-arrow {
            opacity: 0.9;
        }

        .slider-arrow:hover {
            background: #ff5722;
            transform: translateY(-50%) scale(1.1);
        }

        .arrow-left { left: 10px; }
        .arrow-right { right: 10px; }

        .no-photo {
            height: 260px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 18px;
        }

        .area-badge, .capacity-badge {
            position: absolute;
            top: 15px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 6px 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 13px;
            z-index: 15;
        }
        .area-badge { left: 15px; }
        .capacity-badge { right: 15px; }

        .info { padding: 20px; flex: 1; display: flex; flex-direction: column; }
        .type { font-size: 20px; font-weight: bold; text-transform: uppercase; margin: 0 0 10px 0; color: #ff9800; }
        .amenities { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; font-size: 12px; color: #555; }
        .amenities span { background: #f0f0f0; padding: 4px 10px; border-radius: 18px; }
        .owner { font-size: 16px; margin: 12px 0 6px; font-weight: 500; color: #333; }
        .address {
            color: #777;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .availability {
            background: #e8f5e9;
            padding: 8px 10px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 12px;
            border-left: 3px solid #4caf50;
        }
        .availability-label {
            font-weight: 600;
            color: #2e7d32;
            display: block;
            margin-bottom: 3px;
            font-size: 11px;
        }
        .availability-dates {
            color: #1b5e20;
            font-weight: 500;
            font-size: 12px;
        }

        .prices {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 12px 0;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 10px;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .price-label {
            color: #777;
            font-weight: normal;
        }
        .price-value {
            font-weight: bold;
            color: #ff9800;
            font-size: 15px;
        }
        .price-value.highlight {
            color: #ff5722;
            font-size: 16px;
        }
        .details-btn {
            display: block;
            text-align: right;
            color: #ff9800;
            font-weight: bold;
            font-size: 15px;
            margin-top: auto;
        }
        .details-btn:hover { text-decoration: underline; }

        @media (max-width: 1200px) {
            .filters-left .filter-group {
                min-width: 120px;
            }
        }

        @media (max-width: 900px) {
            .filters-container {
                flex-direction: column;
            }
            .filters-buttons {
                justify-content: flex-end;
                width: 100%;
            }
        }

        @media (max-width: 768px) {
            .top-bar { flex-direction: column; align-items: stretch; text-align: center; }
            .left-side { justify-content: center; }
            .center-rent-btn { order: 2; margin: 10px 0; }
            .top-right { justify-content: center; }
            .slider-arrow { width: 30px; height: 30px; font-size: 18px; }
            .filters-left { flex-direction: column; }
            .filter-group { min-width: 100%; }
            .filters-buttons { justify-content: stretch; }
            .reset-btn, .search-btn { flex: 1; text-align: center; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="left-side">
        <div class="location">Нижний Новгород</div>
        <a href="/" class="back-home">Вернуться на главную страницу</a>
    </div>

    <!-- Кнопка по центру -->
    <button class="center-rent-btn"
            th:onclick="'javascript:window.location.href=\'' +
            @{${#authentication.principal != null ? '/premise/add' : '/auth/register'}} + '\''">
        Сдать помещение в аренду
    </button>

    <div class="top-right">
        <div class="phone">
            <span>☎</span>
            <a href="tel:+79991234567">+7 (999) 123-45-67</a>
        </div>

        <!-- Если пользователь авторизован -->
        <div th:if="${#authorization.expression('isAuthenticated()')}" class="user-profile">
            <a th:href="@{/profile}" class="user-info">
                <span class="user-avatar">👤</span>
                <span class="user-name" th:text="${#authentication.name}"></span>
            </a>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="logout-btn">Выйти</button>
            </form>
        </div>

        <!-- Если пользователь не авторизован -->
        <div th:unless="${#authorization.expression('isAuthenticated()')}" class="auth-buttons">
            <a href="/auth/login" class="btn-login">Вход</a>
            <a href="/auth/register" class="btn-register">Регистрация</a>
        </div>
    </div>
</div>

<!-- ФИЛЬТРЫ -->
<div class="filters">
    <div class="filters-container">
        <div class="filters-left">
            <div class="filter-group">
                <label>💰 Цена</label>
                <input type="number" id="priceMax" placeholder="до, ₽">
            </div>
            <div class="filter-group">
                <label>📐 Площадь</label>
                <input type="number" id="areaMin" placeholder="от, м²">
            </div>
            <div class="filter-group">
                <label>👥 Кол-во</label>
                <input type="number" id="capacityMin" placeholder="от, чел.">
            </div>
            <div class="filter-group">
                <label>📅 Заезд</label>
                <input type="date" id="checkInDate">
            </div>
            <div class="filter-group">
                <label>📅 Выезд</label>
                <input type="date" id="checkOutDate">
            </div>
            <div class="filter-group multi-select">
                <label>🏢 Тип</label>
                <div class="multi-select-trigger" id="typeTrigger">Любой</div>
                <div class="multi-select-dropdown" id="typeDropdown">
                    <div class="dropdown-search">
                        <input type="text" id="typeSearch" placeholder="🔍 Поиск..." autocomplete="off">
                    </div>
                    <div id="typeOptionsContainer"></div>
                </div>
            </div>
            <div class="filter-group multi-select">
                <label>✨ Опции</label>
                <div class="multi-select-trigger" id="amenityTrigger">Любые</div>
                <div class="multi-select-dropdown" id="amenityDropdown">
                    <div class="dropdown-search">
                        <input type="text" id="amenitySearch" placeholder="🔍 Поиск..." autocomplete="off">
                    </div>
                    <div id="amenityOptionsContainer"></div>
                </div>
            </div>
            <div class="filter-group multi-select">
                <label>📍 Область</label>
                <div class="multi-select-trigger" id="regionTrigger">Любая</div>
                <div class="multi-select-dropdown" id="regionDropdown">
                    <div class="dropdown-search">
                        <input type="text" id="regionSearch" placeholder="🔍 Поиск..." autocomplete="off">
                    </div>
                    <div id="regionOptionsContainer"></div>
                </div>
            </div>
            <div class="filter-group multi-select">
                <label>🏙️ Город</label>
                <div class="multi-select-trigger" id="cityTrigger">Любой</div>
                <div class="multi-select-dropdown" id="cityDropdown">
                    <div class="dropdown-search">
                        <input type="text" id="citySearch" placeholder="🔍 Поиск..." autocomplete="off">
                    </div>
                    <div id="cityOptionsContainer"></div>
                </div>
            </div>
        </div>
        <div class="filters-buttons">
            <button class="reset-btn" onclick="resetAllFilters()">Сбросить</button>
            <button class="search-btn" onclick="applyFilters()">Применить</button>
        </div>
    </div>
</div>

<!-- Каталог -->
<div class="catalog-grid" id="catalogGrid">
    <div class="premise-card" th:each="p : ${premises}"
         th:data-price="${p.priceWeekday}"
         th:data-area="${p.area}"
         th:data-capacity="${p.capacity}"
         th:data-type="${p.type}"
         th:data-amenities="${#strings.listJoin(p.amenities, ',')}"
         th:data-price-weekend="${p.priceWeekend}"
         th:data-price-holiday="${p.priceHoliday}"
         th:data-available-from="${p.availableFrom}"
         th:data-available-to="${p.availableTo}"
         th:data-region="${p.region}"
         th:data-city="${p.city}">

        <div th:if="${!p.photoPaths.isEmpty()}" class="photos-slider">
            <div class="photos-container">
                <img th:each="photo : ${p.photoPaths}"
                     th:src="@{'/uploads/' + ${photo}}"
                     class="photo-item"
                     onclick="openFullscreen(this.src)"
                     onerror="this.src='/images/no-photo.jpg';">
            </div>
        </div>
        <div class="no-photo" th:unless="${!p.photoPaths.isEmpty()}">📷 Нет фото</div>

        <div class="area-badge" th:text="${p.area} + ' м²'"></div>
        <div class="capacity-badge" th:text="${p.capacity} + ' чел.'"></div>

        <div class="info">
            <div class="type" th:text="${p.getTypeInRussian()}"></div>
            <div class="amenities" th:if="${!p.amenities.isEmpty()}">
                <span th:each="a : ${p.amenities}" th:text="${p.getAmenityInRussian(a)}"></span>
            </div>
            <div class="owner" th:text="${p.contactFirstName} + ' ' + ${p.contactLastName}"></div>
            <div class="address" th:text="${p.region} + ', ' + ${p.city} + ', ' + ${p.street} + ' ' + ${p.building}"></div>

            <div class="availability">
                <span class="availability-label">📅 Доступно:</span>
                <span class="availability-dates">
                    <span th:text="${#temporals.format(p.availableFrom, 'dd.MM.yyyy')}"></span> —
                    <span th:text="${#temporals.format(p.availableTo, 'dd.MM.yyyy')}"></span>
                </span>
            </div>

            <div class="prices">
                <div class="price-row">
                    <span class="price-label">Будни:</span>
                    <span class="price-value" th:text="${p.priceWeekday} + ' ₽'"></span>
                </div>
                <div class="price-row" th:if="${p.priceWeekend != null && p.priceWeekend > 0}">
                    <span class="price-label">Выходные:</span>
                    <span class="price-value highlight" th:text="${p.priceWeekend} + ' ₽'"></span>
                </div>
                <div class="price-row" th:if="${p.priceHoliday != null && p.priceHoliday > 0}">
                    <span class="price-label">Праздники:</span>
                    <span class="price-value highlight" th:text="${p.priceHoliday} + ' ₽'"></span>
                </div>
            </div>

            <a th:href="@{'/premise/' + ${p.id}}" class="details-btn">Подробнее →</a>
        </div>
    </div>
</div>

<div id="noResults" style="display:none; text-align:center; padding:80px; font-size:20px; color:#999;">
    😔 По вашему запросу ничего не найдено
</div>

<div id="fullscreen" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:9999; cursor:pointer; align-items:center; justify-content:center;" onclick="this.style.display='none'">
    <img id="fullImg" style="max-width:95%; max-height:95%; object-fit:contain;">
</div>

<script>
    let selectedRegions = new Set();
    let selectedCities = new Set();
    let selectedTypes = new Set();
    let selectedAmenities = new Set();

    let availableRegions = [];
    let availableCities = [];
    let availableTypes = [];
    let availableAmenities = [];

    let typeInRussianMap = {};
    let amenityInRussianMap = {};

    function syncDateInputs() {
        window.currentCheckInISO = document.getElementById('checkInDate').value || '';
        window.currentCheckOutISO = document.getElementById('checkOutDate').value || '';
    }

    function openFullscreen(src) {
        document.getElementById('fullImg').src = src;
        document.getElementById('fullscreen').style.display = 'flex';
    }

    function prevPhoto(btn) {
        const slider = btn.parentElement;
        const container = slider.querySelector('.photos-container');
        let index = parseInt(container.dataset.current || 0);
        const total = container.children.length;
        index = Math.max(0, index - 1);
        container.dataset.current = index;
        container.style.transform = `translateX(-${index * 100}%)`;
        updateArrowsVisibility(slider, index, total);
    }

    function nextPhoto(btn) {
        const slider = btn.parentElement;
        const container = slider.querySelector('.photos-container');
        let index = parseInt(container.dataset.current || 0);
        const total = container.children.length;
        index = Math.min(total - 1, index + 1);
        container.dataset.current = index;
        container.style.transform = `translateX(-${index * 100}%)`;
        updateArrowsVisibility(slider, index, total);
    }

    function updateArrowsVisibility(slider, currentIndex, totalPhotos) {
        const leftArrow = slider.querySelector('.arrow-left');
        const rightArrow = slider.querySelector('.arrow-right');
        if (leftArrow) {
            leftArrow.style.opacity = currentIndex === 0 ? '0' : '0.9';
            leftArrow.style.pointerEvents = currentIndex === 0 ? 'none' : 'auto';
        }
        if (rightArrow) {
            rightArrow.style.opacity = currentIndex === totalPhotos - 1 ? '0' : '0.9';
            rightArrow.style.pointerEvents = currentIndex === totalPhotos - 1 ? 'none' : 'auto';
        }
    }

    function addArrowsToSlider(slider) {
        const container = slider.querySelector('.photos-container');
        const totalPhotos = container ? container.children.length : 0;
        if (totalPhotos > 1 && !slider.querySelector('.arrow-left')) {
            const leftArrow = document.createElement('div');
            leftArrow.className = 'slider-arrow arrow-left';
            leftArrow.innerHTML = '‹';
            leftArrow.onclick = (e) => { e.stopPropagation(); prevPhoto(leftArrow); };
            const rightArrow = document.createElement('div');
            rightArrow.className = 'slider-arrow arrow-right';
            rightArrow.innerHTML = '›';
            rightArrow.onclick = (e) => { e.stopPropagation(); nextPhoto(rightArrow); };
            slider.appendChild(leftArrow);
            slider.appendChild(rightArrow);
            container.dataset.current = '0';
            container.style.transform = 'translateX(0%)';
        }
    }

    function collectLocationData() {
        const cards = document.querySelectorAll('.premise-card');
        const regionsSet = new Set();
        const citiesSet = new Set();

        cards.forEach(card => {
            const region = card.dataset.region;
            const city = card.dataset.city;
            if (region && region.trim()) regionsSet.add(region);
            if (city && city.trim()) citiesSet.add(city);
        });

        availableRegions = Array.from(regionsSet).sort();
        availableCities = Array.from(citiesSet).sort();
    }

    function initTypesAndAmenities() {
        // Получаем данные из атрибутов Thymeleaf (серверные данные)
        const serverTypes = /*[[${types}]]*/ null;
        const serverAmenities = /*[[${amenities}]]*/ null;
        const serverTypeInRussian = /*[[${typeInRussian}]]*/ null;
        const serverAmenityInRussian = /*[[${amenityInRussian}]]*/ null;

        // Используем серверные данные если они есть
        if (serverTypes && Array.isArray(serverTypes) && serverTypes.length > 0) {
            availableTypes = [...serverTypes];
            typeInRussianMap = serverTypeInRussian ? {...serverTypeInRussian} : {};
            console.log('Типы из сервера:', availableTypes);
        } else {
            // Fallback - но такого не должно быть, т.к. сервер всегда передаёт типы
            console.warn('Сервер не передал типы, используем fallback');
            availableTypes = ['OFFICE', 'TRADING', 'WAREHOUSE', 'PRODUCTION', 'HOSPITALITY', 'UNIVERSAL'];
            typeInRussianMap = {
                'OFFICE': 'Офисное',
                'TRADING': 'Торговое',
                'WAREHOUSE': 'Складское',
                'PRODUCTION': 'Производственное',
                'HOSPITALITY': 'Гостиничное',
                'UNIVERSAL': 'Универсальное'
            };
        }

        if (serverAmenities && Array.isArray(serverAmenities) && serverAmenities.length > 0) {
            availableAmenities = [...serverAmenities];
            amenityInRussianMap = serverAmenityInRussian ? {...serverAmenityInRussian} : {};
            console.log('Опции из сервера:', availableAmenities);
        } else {
            console.warn('Сервер не передал опции, используем fallback');
            availableAmenities = ['CONDITIONER', 'WI_FI', 'FURNITURE', 'PARKING', 'SECURITY', 'ELEVATOR', 'KITCHEN', 'CONFERENCE'];
            amenityInRussianMap = {
                'CONDITIONER': 'Кондиционер',
                'WI_FI': 'Wi-Fi',
                'FURNITURE': 'Мебель',
                'PARKING': 'Парковка',
                'SECURITY': 'Охрана',
                'ELEVATOR': 'Лифт',
                'KITCHEN': 'Кухня',
                'CONFERENCE': 'Конференц-зал'
            };
        }
    }

    function renderOptions(containerId, items, selectedSet, searchInputId, map) {
        const container = document.getElementById(containerId);
        if (!container) return;

        const searchInput = document.getElementById(searchInputId);
        const searchTerm = searchInput?.value.toLowerCase() || '';
        const filtered = items.filter(item => (map[item] || item).toLowerCase().includes(searchTerm));

        if (filtered.length === 0) {
            container.innerHTML = '<div class="no-results">Ничего не найдено</div>';
            return;
        }

        container.innerHTML = '';
        filtered.forEach(item => {
            const div = document.createElement('div');
            div.className = 'option-item';
            div.innerHTML = `<input type="checkbox" value="${item.replace(/"/g, '&quot;')}" ${selectedSet.has(item) ? 'checked' : ''}><span>${map[item] || item}</span>`;
            div.onclick = (e) => {
                e.stopPropagation();
                const cb = div.querySelector('input');
                cb.checked = !cb.checked;
                if (cb.checked) selectedSet.add(item);
                else selectedSet.delete(item);
                let triggerId = '', defaultText = '';
                if (containerId === 'regionOptionsContainer') { triggerId = 'regionTrigger'; defaultText = 'Любая'; }
                else if (containerId === 'cityOptionsContainer') { triggerId = 'cityTrigger'; defaultText = 'Любой'; }
                else if (containerId === 'typeOptionsContainer') { triggerId = 'typeTrigger'; defaultText = 'Любой'; }
                else { triggerId = 'amenityTrigger'; defaultText = 'Любые'; }
                updateTriggerText(triggerId, selectedSet, defaultText, map);
                applyFilters();
            };
            container.appendChild(div);
        });
    }

    function updateTriggerText(triggerId, selectedSet, defaultText, map) {
        const trigger = document.getElementById(triggerId);
        if (!trigger) return;
        if (selectedSet.size === 0) trigger.childNodes[0].nodeValue = defaultText;
        else if (selectedSet.size === 1) trigger.childNodes[0].nodeValue = map?.[Array.from(selectedSet)[0]] || Array.from(selectedSet)[0];
        else trigger.childNodes[0].nodeValue = `${selectedSet.size} выбрано`;
    }

    function initDropdowns() {
        renderOptions('regionOptionsContainer', availableRegions, selectedRegions, 'regionSearch', {});
        renderOptions('cityOptionsContainer', availableCities, selectedCities, 'citySearch', {});
        renderOptions('typeOptionsContainer', availableTypes, selectedTypes, 'typeSearch', typeInRussianMap);
        renderOptions('amenityOptionsContainer', availableAmenities, selectedAmenities, 'amenitySearch', amenityInRussianMap);

        const searchInputs = ['regionSearch', 'citySearch', 'typeSearch', 'amenitySearch'];
        searchInputs.forEach(id => {
            const input = document.getElementById(id);
            if (input) {
                input.addEventListener('click', (e) => { e.stopPropagation(); });
                input.addEventListener('input', () => {
                    if (id === 'regionSearch') renderOptions('regionOptionsContainer', availableRegions, selectedRegions, 'regionSearch', {});
                    else if (id === 'citySearch') renderOptions('cityOptionsContainer', availableCities, selectedCities, 'citySearch', {});
                    else if (id === 'typeSearch') renderOptions('typeOptionsContainer', availableTypes, selectedTypes, 'typeSearch', typeInRussianMap);
                    else renderOptions('amenityOptionsContainer', availableAmenities, selectedAmenities, 'amenitySearch', amenityInRussianMap);
                });
            }
        });
    }

    function isDateRangeAvailable(availableFrom, availableTo, checkIn, checkOut) {
        if (!checkIn && !checkOut) return true;
        const fromDate = availableFrom ? new Date(availableFrom) : null;
        const toDate = availableTo ? new Date(availableTo) : null;
        if (!fromDate || !toDate) return true;
        const checkInDate = checkIn ? new Date(checkIn) : null;
        const checkOutDate = checkOut ? new Date(checkOut) : null;
        if (checkInDate && !checkOutDate) return checkInDate >= fromDate && checkInDate <= toDate;
        if (!checkInDate && checkOutDate) return checkOutDate >= fromDate && checkOutDate <= toDate;
        if (checkInDate && checkOutDate) return checkInDate >= fromDate && checkOutDate <= toDate;
        return true;
    }

    function applyFilters() {
        const priceMax = parseFloat(document.getElementById('priceMax').value) || Infinity;
        const areaMin = parseFloat(document.getElementById('areaMin').value) || 0;
        const capacityMin = parseFloat(document.getElementById('capacityMin').value) || 0;
        syncDateInputs();
        const checkInDate = window.currentCheckInISO || '';
        const checkOutDate = window.currentCheckOutISO || '';

        const cards = document.querySelectorAll('.premise-card');
        let visibleCount = 0;

        cards.forEach(card => {
            const price = parseFloat(card.dataset.price) || 0;
            const area = parseFloat(card.dataset.area) || 0;
            const capacity = parseFloat(card.dataset.capacity) || 0;
            const type = card.dataset.type || '';
            const region = card.dataset.region || '';
            const city = card.dataset.city || '';
            const amenitiesStr = card.dataset.amenities || '';
            const cardAmenities = amenitiesStr ? amenitiesStr.split(',').filter(a => a.trim() !== '') : [];

            const matches = price <= priceMax && area >= areaMin && capacity >= capacityMin &&
                (selectedTypes.size === 0 || selectedTypes.has(type)) &&
                (selectedRegions.size === 0 || selectedRegions.has(region)) &&
                (selectedCities.size === 0 || selectedCities.has(city)) &&
                (selectedAmenities.size === 0 || Array.from(selectedAmenities).every(am => cardAmenities.includes(am))) &&
                isDateRangeAvailable(card.dataset.availableFrom, card.dataset.availableTo, checkInDate, checkOutDate);

            card.style.display = matches ? 'flex' : 'none';
            if (matches) visibleCount++;
        });

        document.getElementById('noResults').style.display = visibleCount === 0 ? 'block' : 'none';
    }

    function resetAllFilters() {
        document.getElementById('priceMax').value = '';
        document.getElementById('areaMin').value = '';
        document.getElementById('capacityMin').value = '';
        document.getElementById('checkInDate').value = '';
        document.getElementById('checkOutDate').value = '';
        window.currentCheckInISO = '';
        window.currentCheckOutISO = '';

        selectedRegions.clear();
        selectedCities.clear();
        selectedTypes.clear();
        selectedAmenities.clear();

        document.querySelectorAll('.option-item input[type="checkbox"]').forEach(cb => cb.checked = false);
        updateTriggerText('regionTrigger', selectedRegions, 'Любая', {});
        updateTriggerText('cityTrigger', selectedCities, 'Любой', {});
        updateTriggerText('typeTrigger', selectedTypes, 'Любой', typeInRussianMap);
        updateTriggerText('amenityTrigger', selectedAmenities, 'Любые', amenityInRussianMap);

        renderOptions('regionOptionsContainer', availableRegions, selectedRegions, 'regionSearch', {});
        renderOptions('cityOptionsContainer', availableCities, selectedCities, 'citySearch', {});
        renderOptions('typeOptionsContainer', availableTypes, selectedTypes, 'typeSearch', typeInRussianMap);
        renderOptions('amenityOptionsContainer', availableAmenities, selectedAmenities, 'amenitySearch', amenityInRussianMap);
        applyFilters();
    }

    function setupDropdowns() {
        const dropdowns = [
            { trigger: 'regionTrigger', dropdown: 'regionDropdown' },
            { trigger: 'cityTrigger', dropdown: 'cityDropdown' },
            { trigger: 'typeTrigger', dropdown: 'typeDropdown' },
            { trigger: 'amenityTrigger', dropdown: 'amenityDropdown' }
        ];

        dropdowns.forEach(({ trigger, dropdown }) => {
            const triggerEl = document.getElementById(trigger);
            const dropdownEl = document.getElementById(dropdown);
            if (triggerEl && dropdownEl) {
                triggerEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    dropdowns.forEach(d => {
                        if (d.dropdown !== dropdown) {
                            document.getElementById(d.dropdown)?.classList.remove('show');
                            document.getElementById(d.trigger)?.classList.remove('active');
                        }
                    });
                    dropdownEl.classList.toggle('show');
                    triggerEl.classList.toggle('active');
                });
            }
        });

        document.addEventListener('click', (e) => {
            let isInside = false;
            dropdowns.forEach(({ trigger, dropdown }) => {
                const triggerEl = document.getElementById(trigger);
                const dropdownEl = document.getElementById(dropdown);
                if ((triggerEl && triggerEl.contains(e.target)) || (dropdownEl && dropdownEl.contains(e.target))) {
                    isInside = true;
                }
            });
            if (!isInside) {
                dropdowns.forEach(({ trigger, dropdown }) => {
                    document.getElementById(dropdown)?.classList.remove('show');
                    document.getElementById(trigger)?.classList.remove('active');
                });
            }
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        collectLocationData();
        initTypesAndAmenities();
        initDropdowns();
        setupDropdowns();

        document.querySelectorAll('.photos-slider').forEach(slider => {
            const container = slider.querySelector('.photos-container');
            if (container && container.children.length > 0) {
                container.dataset.current = '0';
                container.style.transform = 'translateX(0%)';
                addArrowsToSlider(slider);
            }
        });

        document.querySelectorAll('#priceMax, #areaMin, #capacityMin, #checkInDate, #checkOutDate').forEach(input => {
            input.addEventListener('input', applyFilters);
        });

        applyFilters();
    });
</script>
</body>
</html>
