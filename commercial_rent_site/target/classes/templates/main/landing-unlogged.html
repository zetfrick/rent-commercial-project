<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аренда коммерческих помещений</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        a { text-decoration: none; }

        /* ====================== HERO ====================== */
        .hero-section {
            height: 100vh;
            min-height: 700px;
            background: url('/images/background.jpeg') center center no-repeat;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: white;
            text-align: center;
            text-shadow: 0 3px 15px rgba(0,0,0,0.7);
        }
        .hero-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .hero-content h1 {
            font-size: 4.5rem;
            margin: 0 0 20px 0;
            font-weight: 700;
            line-height: 1.05;
        }
        .hero-content p {
            font-size: 1.75rem;
            margin: 0 0 50px 0;
            color: #ffddaa;
        }

        .rent-btn {
            background: #ff5722;
            color: white;
            padding: 18px 50px;
            border: none;
            border-radius: 50px;
            font-size: 1.35rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .rent-btn:hover {
            background: #e64a19;
            transform: translateY(-5px);
        }

        /* ====================== НОВОЕ В КАТАЛОГЕ ====================== */
        .new-section {
            padding: 100px 20px 80px;
            background: #f8f9fa;
            text-align: center;
        }
        .new-section h2 {
            font-size: 2.9rem;
            color: #d32f2f;
            margin-bottom: 60px;
        }

        /* Сетка каталога */
        .catalog-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 30px;
            padding: 0 20px;
        }

        /* ====================== КАРТОЧКА ПОМЕЩЕНИЯ ====================== */
        .premise-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .premise-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(255,152,0,0.2);
        }

        .photos-slider {
            position: relative;
            height: 260px;
            overflow: hidden;
            cursor: grab;
            background: #f0f0f0;
        }

        .photos-container {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .photo-item {
            min-width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            z-index: 20;
            opacity: 0;
            transition: all 0.2s ease;
            backdrop-filter: blur(2px);
        }

        .photos-slider:hover .slider-arrow {
            opacity: 0.9;
        }

        .slider-arrow:hover {
            background: #ff5722;
            transform: translateY(-50%) scale(1.1);
        }

        .arrow-left { left: 12px; }
        .arrow-right { right: 12px; }

        .no-photo {
            height: 260px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 18px;
        }

        /* Бейджи площади и вместимости - только внутри карточки */
        .premise-card .area-badge,
        .premise-card .capacity-badge {
            position: absolute;
            top: 15px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            z-index: 15;
        }
        .premise-card .area-badge { left: 15px; }
        .premise-card .capacity-badge { right: 15px; }

        .info { padding: 20px; flex: 1; display: flex; flex-direction: column; }
        .type { font-size: 22px; font-weight: bold; text-transform: uppercase; margin: 0 0 12px 0; color: #ff9800; }
        .amenities { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0; font-size: 13px; color: #555; }
        .amenities span { background: #f0f0f0; padding: 4px 12px; border-radius: 20px; }
        .owner { font-size: 18px; margin: 15px 0 8px; font-weight: 500; color: #333; }
        .address { color: #777; font-size: 14px; line-height: 1.4; margin-bottom: 15px; }

        .availability {
            background: #e8f5e9;
            padding: 10px 12px;
            border-radius: 12px;
            margin: 10px 0;
            font-size: 13px;
            border-left: 4px solid #4caf50;
        }
        .availability-label {
            font-weight: 600;
            color: #2e7d32;
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
        }
        .availability-dates {
            color: #1b5e20;
            font-weight: 500;
            font-size: 13px;
        }

        .prices {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 15px 0;
            background: #f9f9f9;
            padding: 12px;
            border-radius: 12px;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }
        .price-label {
            color: #777;
            font-weight: normal;
        }
        .price-value {
            font-weight: bold;
            color: #ff9800;
            font-size: 16px;
        }
        .price-value.highlight {
            color: #ff5722;
            font-size: 17px;
        }
        .details-btn {
            display: block;
            text-align: right;
            color: #ff9800;
            font-weight: bold;
            font-size: 16px;
            margin-top: auto;
        }
        .details-btn:hover { text-decoration: underline; }

        /* Полноэкранный режим */
        #fullscreen {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        #fullImg {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }

        /* Стиль для кнопки перехода в каталог */
        .catalog-link {
            margin-top: 50px;
            display: inline-block;
            background: #ff9800;
            color: white;
            padding: 14px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }
        .catalog-link:hover {
            background: #f57c00;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .hero-content h1 { font-size: 3.2rem; }
            .catalog-grid { grid-template-columns: 1fr; }
            .slider-arrow {
                width: 34px;
                height: 34px;
                font-size: 20px;
            }
            .arrow-left { left: 8px; }
            .arrow-right { right: 8px; }
        }
    </style>
</head>
<body>

<!-- Хедер: абсолютное позиционирование поверх hero-секции -->
<div th:insert="~{fragments/header :: header(
    currentUri=${currentUri},
    headerClass=''
)}"></div>

<!-- Hero -->
<div class="hero-section">
    <div class="hero-overlay"></div>
    <div class="hero-content">
        <h1>Аренда коммерческих помещений</h1>
        <p>Сдавайте и арендуйте офисы, склады, торговые площади быстро и выгодно</p>

        <button class="rent-btn"
                th:onclick="'javascript:window.location.href=\'' +
                @{${#authentication.principal != null ? '/premise/add' : '/auth/register'}} + '\''">
            Сдать помещение в аренду
        </button>
    </div>
</div>

<!-- Новое в каталоге -->
<section class="new-section">
    <h2>Новое в каталоге</h2>

    <div th:if="${latestPremises != null and !latestPremises.isEmpty()}" class="catalog-grid">
        <div class="premise-card" th:each="p : ${latestPremises}">
            <!-- Слайдер с фото -->
            <div th:if="${!p.photoPaths.isEmpty()}" class="photos-slider">
                <div class="photos-container">
                    <img th:each="photo : ${p.photoPaths}"
                         th:src="@{'/uploads/' + ${photo}}"
                         class="photo-item"
                         onclick="openFullscreen(this.src)"
                         onerror="this.src='/images/no-photo.jpg';">
                </div>
                <div class="slider-arrow arrow-left">‹</div>
                <div class="slider-arrow arrow-right">›</div>
            </div>
            <div class="no-photo" th:unless="${!p.photoPaths.isEmpty()}">📷 Нет фото</div>

            <!-- Бейджи внутри карточки -->
            <div class="area-badge" th:text="${p.area} + ' м²'"></div>
            <div class="capacity-badge" th:text="${p.capacity} + ' чел.'"></div>

            <div class="info">
                <div class="type" th:text="${p.getTypeInRussian()}"></div>
                <div class="amenities" th:if="${!p.amenities.isEmpty()}">
                    <span th:each="a : ${p.amenities}" th:text="${p.getAmenityInRussian(a)}"></span>
                </div>
                <div class="owner" th:text="${p.contactFirstName} + ' ' + ${p.contactLastName}"></div>
                <div class="address" th:text="${p.city} + ', ' + ${p.street} + ' ' + ${p.building}"></div>

                <div class="availability">
                    <span class="availability-label">📅 Доступно для аренды:</span>
                    <span class="availability-dates">
                        <span th:text="${#temporals.format(p.availableFrom, 'dd.MM.yyyy')}"></span> —
                        <span th:text="${#temporals.format(p.availableTo, 'dd.MM.yyyy')}"></span>
                    </span>
                </div>

                <div class="prices">
                    <div class="price-row">
                        <span class="price-label">📅 Будни:</span>
                        <span class="price-value" th:text="${p.priceWeekday} + ' ₽/сутки'"></span>
                    </div>
                    <div class="price-row" th:if="${p.priceWeekend != null && p.priceWeekend > 0}">
                        <span class="price-label">🎉 Выходные:</span>
                        <span class="price-value highlight" th:text="${p.priceWeekend} + ' ₽/сутки'"></span>
                    </div>
                    <div class="price-row" th:if="${p.priceHoliday != null && p.priceHoliday > 0}">
                        <span class="price-label">🌟 Праздники:</span>
                        <span class="price-value highlight" th:text="${p.priceHoliday} + ' ₽/сутки'"></span>
                    </div>
                </div>

                <a th:href="@{'/premise/' + ${p.id}}" class="details-btn">Подробнее →</a>
            </div>
        </div>
    </div>

    <div th:if="${latestPremises == null or latestPremises.isEmpty()}" style="padding:80px; color:#777; font-size:1.3rem;">
        😔 Пока нет добавленных помещений
    </div>

    <a href="/catalog" class="catalog-link">🔍 Перейти в полный каталог</a>
</section>

<!-- Fullscreen просмотр -->
<div id="fullscreen" onclick="this.style.display='none'">
    <img id="fullImg" alt="Полноэкранное фото">
</div>

<div th:insert="~{fragments/footer :: footer}"></div>

<script>
    function openFullscreen(src) {
        const fullDiv = document.getElementById('fullscreen');
        const fullImg = document.getElementById('fullImg');
        fullImg.src = src;
        fullDiv.style.display = 'flex';
    }

    (function() {
        function initSlider(sliderElement) {
            const container = sliderElement.querySelector('.photos-container');
            if (!container) return;
            const totalSlides = container.children.length;
            if (totalSlides <= 1) {
                const arrows = sliderElement.querySelectorAll('.slider-arrow');
                arrows.forEach(arrow => arrow.style.display = 'none');
                return;
            }

            let currentIndex = 0;
            const arrowLeft = sliderElement.querySelector('.arrow-left');
            const arrowRight = sliderElement.querySelector('.arrow-right');

            function updatePosition() {
                container.style.transform = `translateX(-${currentIndex * 100}%)`;
            }

            function nextSlide(e) {
                if (e) e.stopPropagation();
                currentIndex = (currentIndex + 1) % totalSlides;
                updatePosition();
            }

            function prevSlide(e) {
                if (e) e.stopPropagation();
                currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
                updatePosition();
            }

            if (arrowLeft) {
                const newLeft = arrowLeft.cloneNode(true);
                arrowLeft.parentNode.replaceChild(newLeft, arrowLeft);
                newLeft.addEventListener('click', prevSlide);
            }
            if (arrowRight) {
                const newRight = arrowRight.cloneNode(true);
                arrowRight.parentNode.replaceChild(newRight, arrowRight);
                newRight.addEventListener('click', nextSlide);
            }

            updatePosition();
        }

        function initAllSliders() {
            const sliders = document.querySelectorAll('.photos-slider');
            sliders.forEach(slider => {
                if (slider.dataset.initialized === 'true') return;
                initSlider(slider);
                slider.dataset.initialized = 'true';
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initAllSliders);
        } else {
            initAllSliders();
        }
    })();
</script>

</body>
</html>
