<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет | Аренда помещений</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Полный сброс */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #fff5eb 0%, #ffe0cc 100%);
            color: #333;
            position: relative;
            overflow-x: hidden;
            padding-top: 80px;
        }

        @keyframes profileFadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes profileSlideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ====================== ПРОФИЛЬ ====================== */
        .profile-container {
            position: relative;
            background: linear-gradient(135deg, #fff5eb 0%, #ffe0cc 100%);
            width: 100%;
            overflow-x: hidden;
        }

        .profile-container.no-header {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 70px;
            padding-bottom: 70px;
        }

        .profile-container::before {
            content: '';
            position: fixed;
            top: 50%;
            right: -10%;
            width: 40%;
            height: 80%;
            background: radial-gradient(circle, rgba(255, 87, 34, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .profile-container::after {
            content: '';
            position: fixed;
            bottom: 20%;
            left: -10%;
            width: 40%;
            height: 60%;
            background: radial-gradient(circle, rgba(255, 152, 0, 0.04) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .profile-overlay {
            padding: 30px 24px 50px;
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .no-header .profile-overlay {
            padding: 0 24px;
        }

        .profile-success {
            background: linear-gradient(135deg, #4caf50, #45a049);
            color: white;
            text-align: center;
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 60px;
            margin: 0 auto 35px;
            max-width: 500px;
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.3);
            animation: profileFadeInUp 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .profile-success i {
            font-size: 22px;
        }

        .profile-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 40px;
            width: 100%;
        }

        .profile-user-info {
            background: white;
            border-radius: 32px;
            min-width: 300px;
            flex: 2;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            animation: profileFadeInUp 0.6s ease;
            transition: transform 0.3s ease;
        }

        .profile-user-info:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -15px rgba(255, 87, 34, 0.2);
        }

        .profile-header {
            background: linear-gradient(135deg, #ff5722, #ff9800);
            padding: 30px 30px 25px;
            text-align: center;
            position: relative;
            border-radius: 32px 32px 0 0;
        }

        .profile-avatar-wrapper {
            margin-bottom: 15px;
        }

        .profile-avatar-circle {
            width: 90px;
            height: 90px;
            background: white;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            border: 4px solid rgba(255, 255, 255, 0.5);
        }

        .profile-avatar-circle i {
            font-size: 48px;
            color: #ff5722;
        }

        .profile-header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.15);
            letter-spacing: -0.3px;
        }

        .profile-role-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(5px);
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 500;
            color: white;
            margin-top: 12px;
        }

        .profile-role-badge i {
            margin-right: 6px;
        }

        .profile-stats {
            display: flex;
            justify-content: space-around;
            background: #fffaf5;
            padding: 20px 20px;
            border-bottom: 1px solid #ffe0cc;
            flex-wrap: wrap;
            gap: 15px;
        }

        .profile-stat-item {
            text-align: center;
            flex: 1;
            min-width: 100px;
        }

        .profile-stat-number {
            font-size: 28px;
            font-weight: 800;
            color: #ff5722;
            display: block;
            line-height: 1.2;
        }

        .profile-stat-label {
            font-size: 13px;
            color: #8b5a2b;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .profile-body {
            padding: 25px 30px 30px;
        }

        .profile-info-row {
            margin: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #fff0e0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .profile-info-row:last-child {
            border-bottom: none;
        }

        .profile-label {
            color: #ff5722;
            font-weight: 600;
            min-width: 130px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-label i {
            width: 22px;
            font-size: 16px;
            color: #ff9800;
        }

        .profile-value {
            flex: 1;
            text-align: right;
            color: #4a3729;
            font-weight: 500;
            font-size: 15px;
            word-break: break-word;
        }

        .profile-form-group {
            margin-bottom: 22px;
        }

        .profile-form-group label {
            display: block;
            color: #ff5722;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .profile-form-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 2px solid #ffe0cc;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            background: #fffaf5;
        }

        .profile-form-group input:focus {
            outline: none;
            border-color: #ff5722;
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 87, 34, 0.1);
        }

        .profile-readonly-field {
            background: #fff5eb;
            color: #8b5a2b;
            padding: 14px 16px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 500;
            border: 1px solid #ffe0cc;
            word-break: break-word;
        }

        .profile-button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .profile-save-btn, .profile-edit-btn, .profile-cancel-btn {
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        .profile-save-btn {
            background: linear-gradient(135deg, #ff5722, #ff9800);
            color: white;
            flex: 1;
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.3);
        }

        .profile-save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 87, 34, 0.4);
        }

        .profile-edit-btn {
            background: linear-gradient(135deg, #ff5722, #ff9800);
            color: white;
            width: 100%;
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.3);
        }

        .profile-edit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 87, 34, 0.4);
        }

        .profile-cancel-btn {
            background: #fff0e0;
            color: #e64a19;
            text-decoration: none;
            padding: 14px 28px;
            border: 1px solid #ffe0cc;
        }

        .profile-cancel-btn:hover {
            background: #ffe0cc;
            transform: translateY(-2px);
        }

        .profile-right-buttons {
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-width: 280px;
            flex: 1;
            animation: profileSlideInRight 0.6s ease;
        }

        .profile-action-btn {
            background: white;
            color: #ff5722;
            padding: 20px 28px;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        .profile-action-btn i {
            font-size: 26px;
            width: 36px;
            transition: transform 0.3s ease;
        }

        .profile-action-btn .btn-text {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-action-btn .profile-arrow-icon {
            font-size: 18px;
            color: #ff9800;
            transition: transform 0.3s ease;
        }

        .profile-action-btn:hover {
            transform: translateX(8px);
            background: #fffaf5;
            box-shadow: 0 12px 30px rgba(255, 87, 34, 0.15);
        }

        .profile-action-btn:hover i {
            transform: scale(1.1);
        }

        .profile-action-btn:hover .profile-arrow-icon {
            transform: translateX(5px);
        }

        /* Специальные стили для кнопок */
        .admin-premium-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
            border-left: 5px solid #ffd700;
        }

        .admin-premium-btn i {
            color: #ffd700;
        }

        .admin-premium-btn .profile-arrow-icon {
            color: rgba(255, 255, 255, 0.8);
        }

        .admin-premium-btn:hover {
            background: linear-gradient(135deg, #5a67d8 0%, #6b46a0 100%);
            transform: translateX(8px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.4);
        }

        .complaint-danger-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(238, 90, 36, 0.3);
            border-left: 5px solid #ffeb3b;
        }

        .complaint-danger-btn i {
            color: #ffeb3b;
        }

        .complaint-danger-btn .profile-arrow-icon {
            color: rgba(255, 255, 255, 0.8);
        }

        .complaint-danger-btn:hover {
            background: linear-gradient(135deg, #ff5252 0%, #e84118 100%);
            transform: translateX(8px);
            box-shadow: 0 12px 35px rgba(238, 90, 36, 0.4);
        }

        .report-user-btn {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(244, 67, 54, 0.3);
            border-left: 5px solid #ff9800;
        }

        .report-user-btn i {
            color: #ff9800;
        }

        .report-user-btn .profile-arrow-icon {
            color: rgba(255, 255, 255, 0.8);
        }

        .report-user-btn:hover {
            background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
            transform: translateX(8px);
            box-shadow: 0 12px 35px rgba(244, 67, 54, 0.4);
        }

        .chat-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #ff5722;
            color: white;
            font-size: 11px;
            font-weight: bold;
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            border-radius: 20px;
            text-align: center;
            line-height: 1;
            margin-left: 8px;
        }

        /* Модальное окно для жалобы */
        .report-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }
        .report-modal-content {
            background: white;
            margin: 15% auto;
            padding: 0;
            width: 90%;
            max-width: 500px;
            border-radius: 20px;
            animation: modalFadeIn 0.3s ease;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .report-modal-header {
            padding: 20px;
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
            border-radius: 20px 20px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .report-modal-header h3 {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .report-modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: white;
        }
        .report-modal-body {
            padding: 20px;
        }
        .report-modal-body textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
            margin-bottom: 15px;
        }
        .report-modal-body textarea:focus {
            outline: none;
            border-color: #f44336;
        }
        .report-submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .report-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
        }

        @media (max-width: 900px) {
            .profile-overlay { padding: 20px 16px 40px; }
            .profile-content { flex-direction: column; align-items: stretch; }
            .profile-user-info { min-width: auto; }
            .profile-right-buttons { min-width: auto; }
            .profile-info-row { flex-direction: column; align-items: flex-start; gap: 8px; }
            .profile-label { min-width: auto; }
            .profile-value { text-align: left; width: 100%; }
            .profile-button-group { flex-direction: column; }
            .profile-save-btn, .profile-cancel-btn { width: 100%; }
        }

        @media (max-width: 768px) {
            .header { padding: 8px 16px; flex-wrap: wrap; gap: 8px; }
            .nav-left { flex-wrap: wrap; gap: 12px; }
        }

        @media (max-width: 480px) {
            .profile-body { padding: 20px; }
            .profile-action-btn { padding: 16px 22px; font-size: 15px; }
            .profile-action-btn i { font-size: 22px; width: 28px; }
        }
    </style>
</head>
<body>

<div th:insert="~{fragments/header :: header(
    currentUri=${currentUri},
    headerClass=''
)}"></div>

<!-- ОСНОВНОЙ КОНТЕНТ ПРОФИЛЯ -->
<div class="profile-container">
    <div class="profile-overlay">
        <div th:if="${param.updated}" class="profile-success">
            <i class="fas fa-check-circle"></i>
            <span>Профиль успешно обновлён!</span>
        </div>

        <div class="profile-content">
            <!-- Левая колонка -->
            <div class="profile-user-info">
                <div class="profile-header">
                    <div class="profile-avatar-wrapper">
                        <div class="profile-avatar-circle">
                            <i class="fas fa-user-circle"></i>
                        </div>
                    </div>
                    <h1 th:text="${profileUser?.firstName != null and profileUser?.firstName != ''} ? ${profileUser.firstName} : ${profileUser.login}">Пользователь</h1>
                    <div class="profile-role-badge">
                        <i class="fas fa-user-shield"></i>
                        <span th:text="${profileUser.role.name() == 'USER' ? 'Пользователь' : (profileUser.role.name() == 'ADMIN' ? 'Администратор' : 'Главный администратор')}"></span>
                    </div>
                </div>

                <div class="profile-stats">
                    <div class="profile-stat-item">
                        <span class="profile-stat-number" th:text="${rentedOutCount}">0</span>
                        <span class="profile-stat-label"><i class="fas fa-key"></i> Сдаётся</span>
                    </div>
                    <div class="profile-stat-item">
                        <span class="profile-stat-number" th:text="${rentedInCount}">0</span>
                        <span class="profile-stat-label"><i class="fas fa-building"></i> Арендовано</span>
                    </div>
                    <div class="profile-stat-item">
                        <span class="profile-stat-number" th:text="${profileUser.id}">1</span>
                        <span class="profile-stat-label"><i class="fas fa-calendar-alt"></i> С нами</span>
                    </div>
                </div>

                <div class="profile-body">
                    <form th:object="${profileUser}" th:action="@{/profile/edit}" method="post" th:if="${editMode}">
                        <div class="profile-form-group">
                            <label><i class="fas fa-user"></i> Имя</label>
                            <input type="text" th:field="*{firstName}" placeholder="Ваше имя">
                        </div>
                        <div class="profile-form-group">
                            <label><i class="fas fa-user-tag"></i> Фамилия</label>
                            <input type="text" th:field="*{lastName}" placeholder="Ваша фамилия">
                        </div>
                        <div class="profile-form-group">
                            <label><i class="fas fa-user-friends"></i> Отчество</label>
                            <input type="text" th:field="*{middleName}" placeholder="Отчество (необязательно)">
                        </div>
                        <div class="profile-form-group">
                            <label><i class="fas fa-phone-alt"></i> Телефон</label>
                            <input type="tel" th:field="*{phone}" placeholder="+7 999 123 45 67">
                        </div>
                        <div class="profile-form-group">
                            <label><i class="fas fa-envelope"></i> Электронная почта</label>
                            <div class="profile-readonly-field" th:text="*{email}"></div>
                        </div>
                        <div class="profile-form-group">
                            <label><i class="fas fa-at"></i> Логин</label>
                            <div class="profile-readonly-field" th:text="*{login}"></div>
                        </div>
                        <div class="profile-button-group">
                            <button type="submit" class="profile-save-btn"><i class="fas fa-save"></i> Сохранить изменения</button>
                            <a th:href="@{/profile}" class="profile-cancel-btn"><i class="fas fa-times"></i> Отмена</a>
                        </div>
                    </form>

                    <div th:unless="${editMode}">
                        <div class="profile-info-row">
                            <span class="profile-label"><i class="fas fa-user"></i> Имя</span>
                            <span class="profile-value" th:text="${profileUser?.firstName != null and profileUser?.firstName != ''} ? ${profileUser.firstName} : 'Не указано'"></span>
                        </div>
                        <div class="profile-info-row">
                            <span class="profile-label"><i class="fas fa-user-tag"></i> Фамилия</span>
                            <span class="profile-value" th:text="${profileUser?.lastName != null and profileUser?.lastName != ''} ? ${profileUser.lastName} : 'Не указано'"></span>
                        </div>
                        <div class="profile-info-row">
                            <span class="profile-label"><i class="fas fa-user-friends"></i> Отчество</span>
                            <span class="profile-value" th:text="${profileUser?.middleName != null and profileUser?.middleName != ''} ? ${profileUser.middleName} : 'Не указано'"></span>
                        </div>
                        <div class="profile-info-row">
                            <span class="profile-label"><i class="fas fa-phone-alt"></i> Телефон</span>
                            <span class="profile-value" th:text="${profileUser?.phone != null and profileUser?.phone != ''} ? ${profileUser.phone} : 'Не указан'"></span>
                        </div>
                        <div class="profile-info-row">
                            <span class="profile-label"><i class="fas fa-envelope"></i> Почта</span>
                            <span class="profile-value" th:text="${profileUser.email}"></span>
                        </div>
                        <div class="profile-info-row">
                            <span class="profile-label"><i class="fas fa-at"></i> Логин</span>
                            <span class="profile-value" th:text="${profileUser.login}"></span>
                        </div>
                        <button th:if="${isOwnProfile}" class="profile-edit-btn" onclick="window.location.href='/profile/edit'">
                            <i class="fas fa-pen"></i> Редактировать профиль
                        </button>
                    </div>
                </div>
            </div>

            <!-- Правая панель -->
            <div class="profile-right-buttons">
                <button th:if="${isOwnProfile}" class="profile-action-btn" onclick="window.location.href='/chats'" style="border-left: 5px solid #4caf50;" id="chatsButton">
                    <i class="fas fa-comments"></i>
                    <span class="btn-text">Сообщения и чаты <span id="chatsBadge" class="chat-badge" style="display: none;"></span></span>
                    <i class="fas fa-chevron-right profile-arrow-icon"></i>
                </button>

                <button th:if="${isOwnProfile}" class="profile-action-btn" onclick="alert('⭐ Избранное — в разработке')" style="border-left: 5px solid #ff5722;">
                    <i class="fas fa-heart"></i>
                    <span class="btn-text">Избранное</span>
                    <i class="fas fa-chevron-right profile-arrow-icon"></i>
                </button>

                <!-- АДМИНИСТРАТОРЫ - для SUPER_ADMIN -->
                <button th:if="${profileUser.role.name() == 'SUPER_ADMIN'}"
                        class="profile-action-btn admin-premium-btn"
                        onclick="window.location.href='/admin/admins'">
                    <i class="fas fa-crown"></i>
                    <span class="btn-text">Администраторы</span>
                    <i class="fas fa-chevron-right profile-arrow-icon"></i>
                </button>

                <!-- ЖАЛОБЫ - для ADMIN и SUPER_ADMIN (теперь открывает страницу жалоб) -->
                <button th:if="${profileUser.role.name() == 'ADMIN' or profileUser.role.name() == 'SUPER_ADMIN'}"
                        class="profile-action-btn complaint-danger-btn"
                        onclick="window.location.href='/admin/complaints'">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span class="btn-text">Жалобы</span>
                    <i class="fas fa-chevron-right profile-arrow-icon"></i>
                </button>

                <!-- ПОЖАЛОВАТЬСЯ НА ПОЛЬЗОВАТЕЛЯ -->
                <button th:if="${!isOwnProfile and (#authorization.expression('isAuthenticated()')) and profileUser.role.name() != 'ADMIN' and profileUser.role.name() != 'SUPER_ADMIN'}"
                        class="profile-action-btn report-user-btn"
                        onclick="openUserReportModal()">
                    <i class="fas fa-flag"></i>
                    <span class="btn-text">Пожаловаться на пользователя</span>
                    <i class="fas fa-chevron-right profile-arrow-icon"></i>
                </button>

                <!-- ОБЪЯВЛЕНИЯ -->
                <a th:if="${isOwnProfile}"
                   th:href="@{/profile/{username}/premises(username=${profileUser.login})}"
                   class="profile-action-btn"
                   style="border-left: 5px solid #ff9800; text-decoration: none; display: flex;">
                    <i class="fas fa-key"></i>
                    <span class="btn-text">Мои объявления (сдаётся)</span>
                    <i class="fas fa-chevron-right profile-arrow-icon"></i>
                </a>

                <a th:unless="${isOwnProfile}"
                   th:href="@{/profile/{username}/premises(username=${profileUser.login})}"
                   class="profile-action-btn"
                   style="border-left: 5px solid #ff9800; text-decoration: none; display: flex;">
                    <i class="fas fa-key"></i>
                    <span class="btn-text">Объявления пользователя</span>
                    <i class="fas fa-chevron-right profile-arrow-icon"></i>
                </a>

                <button th:if="${isOwnProfile}" class="profile-action-btn" onclick="alert('📋 Арендованные помещения — в разработке')" style="border-left: 5px solid #ffc107;">
                    <i class="fas fa-building"></i>
                    <span class="btn-text">Арендованные помещения</span>
                    <i class="fas fa-chevron-right profile-arrow-icon"></i>
                </button>

                <button class="profile-action-btn" onclick="alert('📜 История объявлений — в разработке')" style="border-left: 5px solid #ff6f00;">
                    <i class="fas fa-history"></i>
                    <span class="btn-text">История объявлений</span>
                    <i class="fas fa-chevron-right profile-arrow-icon"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно для жалобы на пользователя -->
<div id="userReportModal" class="report-modal">
    <div class="report-modal-content">
        <div class="report-modal-header">
            <h3><i class="fas fa-flag"></i> Пожаловаться на пользователя</h3>
            <button class="report-modal-close" onclick="closeUserReportModal()">&times;</button>
        </div>
        <div class="report-modal-body">
            <div class="form-group">
                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Тема жалобы <span style="color: #f44336;">*</span></label>
                <input type="text" id="userReportSubject" maxlength="100" placeholder="Кратко опишите суть жалобы (до 100 символов)" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px;">
                <small style="color: #999; display: block; margin-top: 5px;">Максимум 100 символов. Осталось: <span id="userSubjectCounter">100</span></small>
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Подробное описание <span style="color: #f44336;">*</span></label>
                <textarea id="userReportReason" placeholder="Опишите причину жалобы подробно..." style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; resize: vertical; min-height: 120px;"></textarea>
                <small style="color: #999; display: block; margin-top: 5px;">Максимум 2000 символов</small>
            </div>
            <button class="report-submit-btn" onclick="submitUserReport()">Отправить жалобу</button>
        </div>
    </div>
</div>

<script>
    function updateChatButtonBadge() {
        const badgeElement = document.getElementById('chatsBadge');
        if (!badgeElement) return;
        const unreadCount = localStorage.getItem('unreadChatsCount');
        if (unreadCount && parseInt(unreadCount) > 0) {
            badgeElement.textContent = unreadCount;
            badgeElement.style.display = 'inline-flex';
        } else {
            badgeElement.style.display = 'none';
        }
    }

    function loadUnreadChatsCount() {
        fetch('/chats/api/chats')
            .then(response => response.json())
            .then(chats => {
                const chatsWithUnread = chats.filter(chat => chat.unreadCount > 0).length;
                localStorage.setItem('unreadChatsCount', chatsWithUnread);
                updateChatButtonBadge();
            })
            .catch(error => console.error('Error loading unread chats count:', error));
    }

    window.addEventListener('unreadChatsUpdate', function(e) {
        if (e.detail && e.detail.count !== undefined) {
            localStorage.setItem('unreadChatsCount', e.detail.count);
        }
        updateChatButtonBadge();
    });

    // Счётчик символов для темы
    document.getElementById('userReportSubject')?.addEventListener('input', function() {
        const maxLength = 100;
        const currentLength = this.value.length;
        const remaining = maxLength - currentLength;
        const counter = document.getElementById('userSubjectCounter');
        if (counter) counter.textContent = remaining;
        if (remaining < 0) {
            this.value = this.value.substring(0, maxLength);
            if (counter) counter.textContent = 0;
        }
    });

    function openUserReportModal() {
        document.getElementById('userReportSubject').value = '';
        document.getElementById('userReportReason').value = '';
        document.getElementById('userSubjectCounter').textContent = '100';
        document.getElementById('userReportModal').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    function closeUserReportModal() {
        document.getElementById('userReportModal').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    function submitUserReport() {
        const subject = document.getElementById('userReportSubject').value.trim();
        const reason = document.getElementById('userReportReason').value.trim();
        const reportedUsername = '[[${profileUser.login}]]';
        const reportedUserId = '[[${profileUser.id}]]';

        if (!subject) {
            showNotification('Пожалуйста, укажите тему жалобы', true);
            return;
        }

        if (subject.length > 100) {
            showNotification('Тема жалобы не должна превышать 100 символов', true);
            return;
        }

        if (!reason) {
            showNotification('Пожалуйста, укажите причину жалобы', true);
            return;
        }

        if (reason.length > 2000) {
            showNotification('Описание жалобы не должно превышать 2000 символов', true);
            return;
        }

        fetch('/api/complaints', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                subject: subject,
                reason: reason,
                type: 'USER',
                userId: reportedUserId,
                targetName: reportedUsername
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showNotification('Жалоба отправлена администратору. Спасибо за бдительность!');
                closeUserReportModal();
            } else {
                showNotification(data.message || 'Ошибка при отправке жалобы', true);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            showNotification('Не удалось отправить жалобу', true);
        });
    }

    function showNotification(message, isError = false) {
        const notification = document.createElement('div');
        notification.style.position = 'fixed';
        notification.style.bottom = '20px';
        notification.style.right = '20px';
        notification.style.background = isError ? '#ff5722' : '#4caf50';
        notification.style.color = 'white';
        notification.style.padding = '14px 22px';
        notification.style.borderRadius = '10px';
        notification.style.zIndex = '10000';
        notification.style.animation = 'slideIn 0.4s ease';
        notification.textContent = message;
        document.body.appendChild(notification);
        setTimeout(() => {
            notification.style.opacity = '0';
            setTimeout(() => notification.remove(), 600);
        }, 5000);
    }

    window.onclick = function(event) {
        const modal = document.getElementById('userReportModal');
        if (event.target === modal) {
            closeUserReportModal();
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadUnreadChatsCount();
        setInterval(loadUnreadChatsCount, 10000);
    });
</script>

<style>
    @keyframes slideIn {
        from { transform: translateX(120%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }
</style>

</body>
</html>
