<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет | Аренда помещений</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Полный сброс - ИСПРАВЛЕНО: убраны конфликтующие overflow */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden; /* Только горизонтальный скролл скрыт */
            overflow-y: auto; /* Вертикальный скролл正常工作 */
        }

        body {
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #fff5eb 0%, #ffe0cc 100%);
            color: #333;
            position: relative;
            overflow-x: hidden;
        }

        /* Анимации для контента профиля */
        @keyframes profileFadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes profileSlideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ====================== ХЕДЕР (как на странице деталей) ====================== */
        .profile-page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 30px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            position: relative;
            z-index: 1000;
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            width: 100%;
        }

        .profile-page-nav-left {
            display: flex;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .profile-page-nav-left a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            white-space: nowrap;
        }

        .profile-page-nav-left a:hover {
            color: #ffcc80;
        }

        .profile-page-city-dropdown {
            position: relative;
            cursor: pointer;
        }

        .profile-page-current-city {
            padding: 5px 12px;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 6px;
            background: rgba(255,255,255,0.15);
            white-space: nowrap;
            font-size: 14px;
        }

        .profile-page-city-list {
            position: absolute;
            top: calc(100% + 5px);
            left: 0;
            list-style: none;
            padding: 6px 0;
            margin: 0;
            background: rgba(0,0,0,0.95);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            min-width: 170px;
            z-index: 1010;
            display: none;
            backdrop-filter: blur(10px);
        }

        .profile-page-city-dropdown:hover .profile-page-city-list {
            display: block;
        }

        .profile-page-city-list li a {
            padding: 8px 14px;
            display: block;
            color: white;
            text-decoration: none;
            font-size: 13px;
        }

        .profile-page-city-list li a:hover {
            background: #ff5722;
        }

        .profile-page-nav-right {
            display: flex;
            align-items: center;
        }

        .profile-page-user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.12);
            padding: 4px 6px 4px 4px;
            border-radius: 40px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.25);
        }

        .profile-page-user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: white;
            padding: 3px 12px 3px 6px;
            border-radius: 40px;
            transition: all 0.3s ease;
        }

        .profile-page-user-info:hover {
            background: rgba(255,255,255,0.18);
        }

        .profile-page-user-avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #ff5722, #ff9800);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(255,87,34,0.4);
        }

        .profile-page-user-name {
            font-weight: 600;
            font-size: 13px;
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-page-logout-btn {
            background: #ff5722;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .profile-page-logout-btn:hover {
            background: #e64a19;
            transform: translateY(-1px);
        }

        .profile-page-auth-links a {
            color: white;
            text-decoration: none;
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 13px;
        }

        .profile-page-login-link:hover {
            background: rgba(255,255,255,0.15);
        }

        .profile-page-register-link {
            background: #ff5722;
        }

        .profile-page-register-link:hover {
            background: #e64a19;
        }

        /* Контейнер профиля - ИСПРАВЛЕНО: убран overflow и проблемы с псевдоэлементами */
        .profile-container {
            position: relative;
            background: linear-gradient(135deg, #fff5eb 0%, #ffe0cc 100%);
            width: 100%;
            overflow-x: hidden;
        }

        /* Когда хедере скрыт, добавляем отступ сверху для контейнера */
        .profile-container.no-header {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 70px; /* Добавляем отступ сверху, равный примерной высоте хедера */
            padding-bottom: 70px; /* Добавляем отступ снизу для баланса */
        }

        /* Декоративные элементы фона - ИСПРАВЛЕНО: убраны выходящие за пределы элементы */
        .profile-container::before {
            content: '';
            position: fixed;
            top: 50%;
            right: -10%;
            width: 40%;
            height: 80%;
            background: radial-gradient(circle, rgba(255, 87, 34, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .profile-container::after {
            content: '';
            position: fixed;
            bottom: 20%;
            left: -10%;
            width: 40%;
            height: 60%;
            background: radial-gradient(circle, rgba(255, 152, 0, 0.04) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .profile-overlay {
            padding: 30px 24px 50px;
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Когда хедере скрыт, корректируем отступы */
        .no-header .profile-overlay {
            padding: 0 24px;
        }

        /* Уведомление об успехе */
        .profile-success {
            background: linear-gradient(135deg, #4caf50, #45a049);
            color: white;
            text-align: center;
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 60px;
            margin: 0 auto 35px;
            max-width: 500px;
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.3);
            animation: profileFadeInUp 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .profile-success i {
            font-size: 22px;
        }

        /* ====================== ОСНОВНОЙ КОНТЕНТ ====================== */
        .profile-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 40px;
            width: 100%;
        }

        /* Блок информации о пользователе */
        .profile-user-info {
            background: white;
            border-radius: 32px;
            min-width: 300px;
            flex: 2;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            animation: profileFadeInUp 0.6s ease;
            transition: transform 0.3s ease;
        }

        .profile-user-info:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -15px rgba(255, 87, 34, 0.2);
        }

        .profile-header {
            background: linear-gradient(135deg, #ff5722, #ff9800);
            padding: 30px 30px 25px;
            text-align: center;
            position: relative;
            border-radius: 32px 32px 0 0;
        }

        .profile-avatar-wrapper {
            margin-bottom: 15px;
        }

        .profile-avatar-circle {
            width: 90px;
            height: 90px;
            background: white;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            border: 4px solid rgba(255, 255, 255, 0.5);
        }

        .profile-avatar-circle i {
            font-size: 48px;
            color: #ff5722;
        }

        .profile-header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.15);
            letter-spacing: -0.3px;
        }

        .profile-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(5px);
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 500;
            color: white;
            margin-top: 12px;
        }

        .profile-stats {
            display: flex;
            justify-content: space-around;
            background: #fffaf5;
            padding: 20px 20px;
            border-bottom: 1px solid #ffe0cc;
            flex-wrap: wrap;
            gap: 15px;
        }

        .profile-stat-item {
            text-align: center;
            flex: 1;
            min-width: 100px;
        }

        .profile-stat-number {
            font-size: 28px;
            font-weight: 800;
            color: #ff5722;
            display: block;
            line-height: 1.2;
        }

        .profile-stat-label {
            font-size: 13px;
            color: #8b5a2b;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .profile-body {
            padding: 25px 30px 30px;
        }

        .profile-info-row {
            margin: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #fff0e0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .profile-info-row:last-child {
            border-bottom: none;
        }

        .profile-label {
            color: #ff5722;
            font-weight: 600;
            min-width: 130px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-label i {
            width: 22px;
            font-size: 16px;
            color: #ff9800;
        }

        .profile-value {
            flex: 1;
            text-align: right;
            color: #4a3729;
            font-weight: 500;
            font-size: 15px;
            word-break: break-word;
        }

        /* Поля формы */
        .profile-form-group {
            margin-bottom: 22px;
        }

        .profile-form-group label {
            display: block;
            color: #ff5722;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .profile-form-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 2px solid #ffe0cc;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            background: #fffaf5;
        }

        .profile-form-group input:focus {
            outline: none;
            border-color: #ff5722;
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 87, 34, 0.1);
        }

        .profile-readonly-field {
            background: #fff5eb;
            color: #8b5a2b;
            padding: 14px 16px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 500;
            border: 1px solid #ffe0cc;
            word-break: break-word;
        }

        .profile-button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .profile-save-btn, .profile-edit-btn, .profile-cancel-btn {
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        .profile-save-btn {
            background: linear-gradient(135deg, #ff5722, #ff9800);
            color: white;
            flex: 1;
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.3);
        }

        .profile-save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 87, 34, 0.4);
        }

        .profile-edit-btn {
            background: linear-gradient(135deg, #ff5722, #ff9800);
            color: white;
            width: 100%;
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.3);
        }

        .profile-edit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 87, 34, 0.4);
        }

        .profile-cancel-btn {
            background: #fff0e0;
            color: #e64a19;
            text-decoration: none;
            padding: 14px 28px;
            border: 1px solid #ffe0cc;
        }

        .profile-cancel-btn:hover {
            background: #ffe0cc;
            transform: translateY(-2px);
        }

        /* Правая панель с кнопками */
        .profile-right-buttons {
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-width: 280px;
            flex: 1;
            animation: profileSlideInRight 0.6s ease;
        }

        .profile-action-btn {
            background: white;
            color: #ff5722;
            padding: 20px 28px;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        .profile-action-btn i {
            font-size: 26px;
            width: 36px;
            transition: transform 0.3s ease;
        }

        .profile-action-btn span {
            flex: 1;
        }

        .profile-action-btn .profile-arrow-icon {
            font-size: 18px;
            color: #ff9800;
            transition: transform 0.3s ease;
        }

        .profile-action-btn:hover {
            transform: translateX(8px);
            background: #fffaf5;
            box-shadow: 0 12px 30px rgba(255, 87, 34, 0.15);
        }

        .profile-action-btn:hover i {
            transform: scale(1.1);
        }

        .profile-action-btn:hover .profile-arrow-icon {
            transform: translateX(5px);
        }

        /* Адаптивность */
        @media (max-width: 900px) {
            .profile-overlay {
                padding: 20px 16px 40px;
            }

            .no-header .profile-overlay {
                padding: 0 16px;
            }

            .profile-container.no-header {
                padding-top: 50px;
                padding-bottom: 50px;
            }

            .profile-content {
                flex-direction: column;
                align-items: stretch;
            }

            .profile-user-info {
                min-width: auto;
            }

            .profile-right-buttons {
                min-width: auto;
            }

            .profile-info-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .profile-label {
                min-width: auto;
            }

            .profile-value {
                text-align: left;
                width: 100%;
            }

            .profile-button-group {
                flex-direction: column;
            }

            .profile-save-btn, .profile-cancel-btn {
                width: 100%;
            }
        }

        @media (max-width: 768px) {
            .profile-page-header {
                padding: 8px 16px;
                flex-wrap: wrap;
                gap: 12px;
            }

            .profile-page-nav-left {
                flex-wrap: wrap;
                gap: 12px;
            }

            .profile-page-nav-right {
                margin-left: auto;
            }
        }

        @media (max-width: 480px) {
            .profile-body {
                padding: 20px;
            }

            .profile-action-btn {
                padding: 16px 22px;
                font-size: 15px;
            }

            .profile-action-btn i {
                font-size: 22px;
                width: 28px;
            }

            .profile-page-header {
                flex-direction: column;
                align-items: stretch;
            }

            .profile-page-nav-right {
                justify-content: center;
            }

            .profile-container.no-header {
                padding-top: 30px;
                padding-bottom: 30px;
            }
        }
    </style>
</head>
<body>

<!-- ХЕДЕР ПОКАЗЫВАЕТСЯ ТОЛЬКО ЕСЛИ ПРОСМАТРИВАЕТСЯ ЧУЖОЙ ПРОФИЛЬ -->
<header th:unless="${isOwnProfile}" class="profile-page-header">
    <div class="profile-page-nav-left">
        <a href="/about">О нас</a>

        <!-- Выбор города -->
        <div class="profile-page-city-dropdown">
            <span class="profile-page-current-city" th:text="${currentCity}">Нижний Новгород</span>
            <ul class="profile-page-city-list">
                <li><a th:href="@{${currentUri}(city='Москва')}">Москва</a></li>
                <li><a th:href="@{${currentUri}(city='Ростов на Дону')}">Ростов на Дону</a></li>
                <li><a th:href="@{${currentUri}(city='Владимир')}">Владимир</a></li>
                <li><a th:href="@{${currentUri}(city='Владивосток')}">Владивосток</a></li>
                <li class="selected"><a th:href="@{${currentUri}(city='Нижний Новгород')}">Нижний Новгород</a></li>
            </ul>
        </div>
    </div>

    <div class="profile-page-nav-right">
        <!-- Если пользователь авторизован - показываем информацию о текущем пользователе (не о просматриваемом) -->
        <div th:if="${#authorization.expression('isAuthenticated()')}" class="profile-page-user-profile">
            <a th:href="@{/profile}" class="profile-page-user-info">
                <span class="profile-page-user-avatar">👤</span>
                <span class="profile-page-user-name" th:text="${#authentication.name}"></span>
            </a>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="profile-page-logout-btn">Выйти</button>
            </form>
        </div>

        <!-- Если пользователь не авторизован -->
        <div th:unless="${#authorization.expression('isAuthenticated()')}" class="profile-page-auth-links">
            <a href="/auth/login" class="profile-page-login-link">Вход</a>
            <a href="/auth/register" class="profile-page-register-link">Регистрация</a>
        </div>
    </div>
</header>

<!-- Если профиль свой - добавляем класс no-header для центрирования контента с отступами -->
<div th:class="${isOwnProfile} ? 'profile-container no-header' : 'profile-container'">
    <div class="profile-overlay">
        <div th:if="${param.updated}" class="profile-success">
            <i class="fas fa-check-circle"></i>
            <span>Профиль успешно обновлён!</span>
        </div>

        <div class="profile-content">
            <!-- Левая колонка - информация о пользователе -->
            <div class="profile-user-info">
                <div class="profile-header">
                    <div class="profile-avatar-wrapper">
                        <div class="profile-avatar-circle">
                            <i class="fas fa-user-circle"></i>
                        </div>
                    </div>
                    <h1 th:text="${profileUser?.firstName != null and profileUser?.firstName != ''} ? ${profileUser.firstName} : ${profileUser.login}">Пользователь</h1>
                    <div class="profile-badge">
                        <i class="fas fa-user-check"></i> Аккаунт подтверждён
                    </div>
                </div>

                <div class="profile-stats">
                    <div class="profile-stat-item">
                        <span class="profile-stat-number" th:text="${rentedOutCount}">0</span>
                        <span class="profile-stat-label"><i class="fas fa-key"></i> Сдаётся</span>
                    </div>
                    <div class="profile-stat-item">
                        <span class="profile-stat-number" th:text="${rentedInCount}">0</span>
                        <span class="profile-stat-label"><i class="fas fa-building"></i> Арендовано</span>
                    </div>
                    <div class="profile-stat-item">
                        <span class="profile-stat-number" th:text="${profileUser.id}">1</span>
                        <span class="profile-stat-label"><i class="fas fa-calendar-alt"></i> С нами</span>
                    </div>
                </div>

                <div class="profile-body">
                    <!-- Режим редактирования -->
                    <form th:object="${profileUser}" th:action="@{/profile/edit}" method="post" th:if="${editMode}">
                        <div class="profile-form-group">
                            <label><i class="fas fa-user"></i> Имя</label>
                            <input type="text" th:field="*{firstName}" placeholder="Ваше имя">
                        </div>
                        <div class="profile-form-group">
                            <label><i class="fas fa-user-tag"></i> Фамилия</label>
                            <input type="text" th:field="*{lastName}" placeholder="Ваша фамилия">
                        </div>
                        <div class="profile-form-group">
                            <label><i class="fas fa-user-friends"></i> Отчество</label>
                            <input type="text" th:field="*{middleName}" placeholder="Отчество (необязательно)">
                        </div>
                        <div class="profile-form-group">
                            <label><i class="fas fa-phone-alt"></i> Телефон</label>
                            <input type="tel" th:field="*{phone}" placeholder="+7 999 123 45 67">
                        </div>
                        <div class="profile-form-group">
                            <label><i class="fas fa-envelope"></i> Электронная почта</label>
                            <div class="profile-readonly-field" th:text="*{email}"></div>
                        </div>
                        <div class="profile-form-group">
                            <label><i class="fas fa-at"></i> Логин</label>
                            <div class="profile-readonly-field" th:text="*{login}"></div>
                        </div>

                        <div class="profile-button-group">
                            <button type="submit" class="profile-save-btn">
                                <i class="fas fa-save"></i> Сохранить изменения
                            </button>
                            <a th:href="@{/profile}" class="profile-cancel-btn">
                                <i class="fas fa-times"></i> Отмена
                            </a>
                        </div>
                    </form>

                    <!-- Режим просмотра -->
                    <div th:unless="${editMode}">
                        <div class="profile-info-row">
                            <span class="profile-label"><i class="fas fa-user"></i> Имя</span>
                            <span class="profile-value" th:text="${profileUser?.firstName != null and profileUser?.firstName != ''} ? ${profileUser.firstName} : 'Не указано'"></span>
                        </div>
                        <div class="profile-info-row">
                            <span class="profile-label"><i class="fas fa-user-tag"></i> Фамилия</span>
                            <span class="profile-value" th:text="${profileUser?.lastName != null and profileUser?.lastName != ''} ? ${profileUser.lastName} : 'Не указано'"></span>
                        </div>
                        <div class="profile-info-row">
                            <span class="profile-label"><i class="fas fa-user-friends"></i> Отчество</span>
                            <span class="profile-value" th:text="${profileUser?.middleName != null and profileUser?.middleName != ''} ? ${profileUser.middleName} : 'Не указано'"></span>
                        </div>
                        <div class="profile-info-row">
                            <span class="profile-label"><i class="fas fa-phone-alt"></i> Телефон</span>
                            <span class="profile-value" th:text="${profileUser?.phone != null and profileUser?.phone != ''} ? ${profileUser.phone} : 'Не указан'"></span>
                        </div>
                        <div class="profile-info-row">
                            <span class="profile-label"><i class="fas fa-envelope"></i> Почта</span>
                            <span class="profile-value" th:text="${profileUser.email}"></span>
                        </div>
                        <div class="profile-info-row">
                            <span class="profile-label"><i class="fas fa-at"></i> Логин</span>
                            <span class="profile-value" th:text="${profileUser.login}"></span>
                        </div>

                        <!-- Кнопка редактирования только для владельца -->
                        <button th:if="${isOwnProfile}" class="profile-edit-btn" onclick="window.location.href='/profile/edit'">
                            <i class="fas fa-pen"></i> Редактировать профиль
                        </button>
                    </div>
                </div>
            </div>

            <!-- Правая панель с действиями -->
            <div class="profile-right-buttons">
                <!-- ЧАТЫ - только для владельца -->
                <button th:if="${isOwnProfile}" class="profile-action-btn" onclick="window.location.href='/chats'" style="border-left: 5px solid #4caf50;">
                    <i class="fas fa-comments"></i>
                    <span>Сообщения и чаты</span>
                    <i class="fas fa-chevron-right profile-arrow-icon"></i>
                </button>

                <!-- ИЗБРАННОЕ - только для владельца -->
                <button th:if="${isOwnProfile}" class="profile-action-btn" onclick="alert('⭐ Избранное — в разработке')" style="border-left: 5px solid #ff5722;">
                    <i class="fas fa-heart"></i>
                    <span>Избранное</span>
                    <i class="fas fa-chevron-right profile-arrow-icon"></i>
                </button>

                <!-- ОБЪЯВЛЕНИЯ (меняем текст в зависимости от владельца) -->
                <button class="profile-action-btn"
                        th:if="${isOwnProfile}"
                        onclick="alert('🏠 Мои объявления — в разработке')"
                        style="border-left: 5px solid #ff9800;">
                    <i class="fas fa-key"></i>
                    <span>Мои объявления (сдаётся)</span>
                    <i class="fas fa-chevron-right profile-arrow-icon"></i>
                </button>

                <button class="profile-action-btn"
                        th:unless="${isOwnProfile}"
                        onclick="alert('📋 Объявления пользователя — в разработке')"
                        style="border-left: 5px solid #ff9800;">
                    <i class="fas fa-key"></i>
                    <span>Объявления пользователя</span>
                    <i class="fas fa-chevron-right profile-arrow-icon"></i>
                </button>

                <!-- АРЕНДОВАННЫЕ ПОМЕЩЕНИЯ - только для владельца -->
                <button th:if="${isOwnProfile}" class="profile-action-btn" onclick="alert('📋 Арендованные помещения — в разработке')" style="border-left: 5px solid #ffc107;">
                    <i class="fas fa-building"></i>
                    <span>Арендованные помещения</span>
                    <i class="fas fa-chevron-right profile-arrow-icon"></i>
                </button>

                <!-- ИСТОРИЯ ОПЕРАЦИЙ - для всех (видна и владельцу, и гостю) -->
                <button class="profile-action-btn" onclick="alert('📜 История операций — в разработке')" style="border-left: 5px solid #ff6f00;">
                    <i class="fas fa-history"></i>
                    <span>История операций</span>
                    <i class="fas fa-chevron-right profile-arrow-icon"></i>
                </button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
