<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Arial, sans-serif; }
        .profile-container { min-height: 100vh; background: url('/images/fon.jpeg') no-repeat center center fixed; background-size: cover; position: relative; }
        .overlay { background: rgba(0, 0, 0, 0.45); min-height: 100vh; padding: 40px 20px; display: flex; flex-direction: column; }
        .header-buttons { text-align: center; margin-bottom: 40px; }
        .header-buttons a { background: rgba(255, 152, 0, 0.95); color: white; padding: 14px 34px; margin: 0 15px; text-decoration: none; border-radius: 30px; font-weight: bold; font-size: 18px; transition: all 0.3s; }
        .header-buttons a:hover { background: #ff8f00; transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
        .content { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 50px; max-width: 1400px; margin: 0 auto; }
        .user-info { background: rgba(0, 0, 0, 0.55); padding: 30px; border-radius: 18px; backdrop-filter: blur(5px); min-width: 420px; flex: 1; }
        .user-info h1 { margin: 0 0 30px 0; font-size: 32px; text-align: center; text-shadow: 0 2px 10px rgba(0,0,0,0.7); color: white; }
        .info-row { margin: 18px 0; font-size: 19px; display: flex; justify-content: space-between; align-items: center; }
        .label { color: #ffcc80; font-weight: 600; min-width: 140px; }
        .value { flex: 1; text-align: right; color: white; font-weight: 500; }
        input[type=text], input[type=tel] { width: 100%; padding: 10px; border-radius: 10px; border: none; font-size: 16px; }
        .edit-btn, .save-btn, .cancel-btn { background: #ff5722; color: white; border: none; padding: 12px 24px; border-radius: 25px; cursor: pointer; font-size: 16px; margin-top: 20px; transition: 0.3s; }
        .edit-btn:hover, .save-btn:hover { background: #e64a19; transform: scale(1.05); }
        .cancel-btn { background: #666; margin-left: 10px; }
        .success { color: #8f8; text-align: center; font-weight: bold; margin: 20px 0; }
        .right-buttons { display: flex; flex-direction: column; gap: 22px; margin-top: 20px; }
        .action-btn { background: linear-gradient(135deg, #ff5722, #ff8a65); color: white; padding: 18px 40px; font-size: 19px; font-weight: bold; border: none; border-radius: 50px; cursor: pointer; width: 260px; text-align: center; box-shadow: 0 6px 20px rgba(255,87,34,0.4); transition: all 0.3s; }
        .action-btn:hover { transform: translateY(-4px); box-shadow: 0 12px 25px rgba(255,87,34,0.5); }
        @media (max-width: 900px) { .content { flex-direction: column; align-items: center; } .user-info, .right-buttons { min-width: 100%; } }
    </style>
</head>
<body>
<div class="profile-container">
    <div class="overlay">
        <div class="header-buttons">
            <a th:href="@{/}">Главная страница</a>
            <a th:href="@{/catalog}">Каталог</a>
        </div>

        <div th:if="${param.updated}" class="success">Профиль успешно обновлён!</div>

        <div class="content">
            <div class="user-info">
                <h1>Личный кабинет</h1>

                <form th:object="${currentUser}" th:action="@{/profile/edit}" method="post" th:if="${editMode}">
                    <div class="info-row"><span class="label">Имя:</span>
                        <input type="text" th:field="*{firstName}" placeholder="Имя"/>
                    </div>
                    <div class="info-row"><span class="label">Фамилия:</span>
                        <input type="text" th:field="*{lastName}" placeholder="Фамилия"/>
                    </div>
                    <div class="info-row"><span class="label">Отчество:</span>
                        <input type="text" th:field="*{middleName}" placeholder="Отчество (необязательно)"/>
                    </div>
                    <div class="info-row"><span class="label">Телефон:</span>
                        <input type="tel" th:field="*{phone}" placeholder="+7 999 123 45 67"/>
                    </div>
                    <div class="info-row"><span class="label">Почта:</span> <span class="value" th:text="*{email}"></span></div>
                    <div class="info-row"><span class="label">Ник:</span> <span class="value" th:text="*{login}"></span></div>
                    <div class="info-row"><span class="label">Сдаёт в аренду:</span> <span class="value" th:text="${rentedOutCount}">1</span></div>
                    <div class="info-row"><span class="label">Взято в аренду:</span> <span class="value" th:text="${rentedInCount}">0</span></div>

                    <button type="submit" class="save-btn">Сохранить</button>
                    <a th:href="@{/profile}" class="cancel-btn">Отмена</a>
                </form>

                <div th:unless="${editMode}">
                    <div class="info-row"><span class="label">Имя:</span>         <span class="value" th:text="${currentUser.firstName} ?: 'Нет'"></span></div>
                    <div class="info-row"><span class="label">Фамилия:</span>     <span class="value" th:text="${currentUser.lastName} ?: 'Нет'"></span></div>
                    <div class="info-row"><span class="label">Отчество:</span>    <span class="value" th:text="${currentUser.middleName} ?: 'Нет'"></span></div>
                    <div class="info-row"><span class="label">Телефон:</span>     <span class="value" th:text="${currentUser.phone} ?: 'Нет'"></span></div>
                    <div class="info-row"><span class="label">Почта:</span>       <span class="value" th:text="${currentUser.email}"></span></div>
                    <div class="info-row"><span class="label">Ник:</span>         <span class="value" th:text="${currentUser.login}"></span></div>
                    <div class="info-row"><span class="label">Сдаёт в аренду:</span><span class="value" th:text="${rentedOutCount}">1</span></div>
                    <div class="info-row"><span class="label">Взято в аренду:</span><span class="value" th:text="${rentedInCount}">0</span></div>

                    <a th:href="@{/profile/edit}"><button class="edit-btn">Редактировать</button></a>
                </div>
            </div>

            <div class="right-buttons">
                <button class="action-btn" onclick="alert('В разработке')">Избранное</button>
                <button class="action-btn" onclick="alert('В разработке')">Сдаётся</button>
                <button class="action-btn" onclick="alert('В разработке')">Взято</button>
                <button class="action-btn" onclick="alert('В разработке')">История</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
