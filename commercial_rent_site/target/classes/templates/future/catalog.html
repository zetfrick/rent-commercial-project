<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light only">
    <title>Каталог помещений в аренду | Слайдер с навигацией</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        a { text-decoration: none; }

        /* ====================== ВЕРХНЯЯ ПАНЕЛЬ ====================== */
        .top-bar {
            background: white;
            padding: 15px 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .left-side {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .location {
            font-weight: 600;
            color: #ff5722;
            font-size: 19px;
        }

        .back-home {
            background: #ff5722;
            color: white;
            padding: 10px 28px;
            border-radius: 30px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .back-home:hover {
            background: #e64a19;
            transform: translateY(-2px);
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .phone {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            color: #333;
            font-size: 16px;
        }

        .phone a {
            color: #ff5722;
            font-weight: 600;
        }

        .auth-buttons a {
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-login {
            background: transparent;
            color: #ff5722;
            border: 2px solid #ff5722;
        }

        .btn-login:hover {
            background: #ff5722;
            color: white;
        }

        .btn-register {
            background: #ff5722;
            color: white;
        }

        .btn-register:hover {
            background: #e64a19;
        }

        .profile-btn {
            background: #ff5722;
            color: white;
            padding: 10px 26px;
            border-radius: 30px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .profile-btn:hover {
            background: #e64a19;
            transform: translateY(-2px);
        }

        /* ====================== ФИЛЬТРЫ ====================== */
        .filters {
            background: white;
            padding: 28px 30px;
            margin: 25px auto;
            max-width: 1400px;
            border-radius: 16px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.08);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 18px 25px;
            align-items: end;
        }

        .filter-group label {
            font-size: 13.5px;
            color: #666;
            margin-bottom: 8px;
            display: block;
        }

        .filter-group input,
        .filter-group select {
            padding: 13px 16px;
            border: 1px solid #ddd;
            border-radius: 30px;
            font-size: 15px;
            width: 100%;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        .filter-group input:hover,
        .filter-group select:hover,
        .filter-group input:focus,
        .filter-group select:focus {
            border-color: #ff5722;
            box-shadow: 0 0 0 3px rgba(255,87,34,0.15);
        }

        .search-btn {
            background: #ff5722;
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            height: 52px;
            white-space: nowrap;
        }

        .search-btn:hover {
            background: #e64a19;
        }

        /* ====================== КАТАЛОГ ====================== */
        .catalog-grid {
            max-width: 1400px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 30px;
            padding: 0 20px;
        }

        .premise-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        .premise-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(255,152,0,0.2);
        }

        /* ----- Улучшенный слайдер с кастомными стрелками при ховере ----- */
        .photos-slider {
            position: relative;
            height: 260px;
            overflow: hidden;
            cursor: grab;
            background: #f0f0f0;
            user-select: none;
        }

        .photos-slider:active {
            cursor: grabbing;
        }

        .photos-container {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            will-change: transform;
        }

        .photo-item {
            min-width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: auto;
            cursor: pointer;
        }

        /* Навигационные стрелки — полупрозрачные, появляются только при ховере на слайдер */
        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            transition: all 0.2s ease;
            opacity: 0;
            visibility: hidden;
            color: white;
            font-size: 28px;
            font-weight: bold;
            font-family: monospace;
            user-select: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .photos-slider:hover .slider-arrow {
            opacity: 0.85;
            visibility: visible;
        }

        .slider-arrow:hover {
            background: rgba(0, 0, 0, 0.8);
            transform: translateY(-50%) scale(1.05);
            opacity: 1;
        }

        .arrow-left {
            left: 12px;
        }

        .arrow-right {
            right: 12px;
        }

        /* индикатор количества фото/текущий индекс (необязательно, но стильно) */
        .photo-counter {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            color: white;
            font-weight: 500;
            z-index: 20;
            pointer-events: none;
            font-family: monospace;
            letter-spacing: 0.5px;
        }

        .no-photo {
            height: 260px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 18px;
        }

        .area-badge, .capacity-badge {
            position: absolute;
            top: 15px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            z-index: 15;
        }
        .area-badge { left: 15px; }
        .capacity-badge { right: 15px; }

        .info {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .type { font-size: 22px; font-weight: bold; text-transform: uppercase; margin: 0 0 12px 0; color: #ff9800; }
        .amenities { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0; font-size: 13px; color: #555; }
        .amenities span {
            background: #f0f0f0;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .owner { font-size: 18px; margin: 15px 0 8px; font-weight: 500; color: #333; }
        .address { color: #777; font-size: 14px; line-height: 1.4; margin-bottom: 15px; }
        .prices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 16px; margin: 15px 0; }
        .price-label { color: #777; }
        .price-value { font-weight: bold; color: #ff9800; }
        .details-btn { display: block; text-align: right; color: #ff9800; font-weight: bold; font-size: 16px; margin-top: auto; }
        .details-btn:hover { text-decoration: underline; }

        @media (max-width: 992px) {
            .filters { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
        }
        @media (max-width: 768px) {
            .top-bar { flex-direction: column; align-items: flex-start; padding: 15px; }
            .left-side, .top-right { width: 100%; justify-content: space-between; }
            .slider-arrow {
                width: 34px;
                height: 34px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="left-side">
        <div class="location">Нижний Новгород</div>
        <a href="/" class="back-home">Вернуться на главную страницу</a>
    </div>

    <div class="top-right">
        <div class="phone">
            <span>☎</span>
            <a href="tel:+79991234567">+7 (999) 123-45-67</a>
        </div>

        <div th:if="${#authentication.name == 'anonymousUser'}" class="auth-buttons">
            <a href="/login" class="btn-login">Вход</a>
            <a href="/register" class="btn-register">Регистрация</a>
        </div>

        <div th:unless="${#authentication.name == 'anonymousUser'}">
            <a th:href="@{/profile}" class="profile-btn">Личный кабинет</a>
        </div>
    </div>
</div>

<!-- Фильтры с динамическими значениями -->
<div class="filters">
    <div class="filter-group">
        <label>Цена</label>
        <input type="number" placeholder="до, ₽">
    </div>
    <div class="filter-group">
        <label>Заезд</label>
        <input type="date">
    </div>
    <div class="filter-group">
        <label>Выезд</label>
        <input type="date">
    </div>
    <div class="filter-group">
        <label>Площадь</label>
        <input type="number" placeholder="от, м²">
    </div>

    <!-- Тип помещения — динамически подтягивается -->
    <div class="filter-group">
        <label>Тип помещения</label>
        <select name="type">
            <option value="">Любой</option>
            <option th:each="type : ${types}"
                    th:value="${type}"
                    th:text="${typeInRussian.get(type)}">Офисное</option>
        </select>
    </div>

    <!-- Опции (удобства) — динамически подтягиваются -->
    <div class="filter-group">
        <label>Опции</label>
        <select name="amenity">
            <option value="">Любые</option>
            <option th:each="amenity : ${amenities}"
                    th:value="${amenity}"
                    th:text="${amenityInRussian.get(amenity)}">Кондиционер</option>
        </select>
    </div>

    <div class="filter-group">
        <label>Кол-во человек</label>
        <input type="number" placeholder="от, чел.">
    </div>

    <div class="filter-group">
        <button class="search-btn">Поиск</button>
    </div>
</div>

<!-- Каталог с улучшенным слайдером (стрелки при ховере + drag + клик на фото) -->
<div class="catalog-grid" th:unless="${premises == null || premises.isEmpty()}">
    <div class="premise-card" th:each="p : ${premises}">
        <!-- Слайдер: если есть фото, показываем карусель с навигацией -->
        <div th:if="${!p.photoPaths.isEmpty()}" class="photos-slider" data-slider-id="${p.id}">
            <div class="photos-container">
                <img th:each="photo : ${p.photoPaths}"
                     th:src="@{'/uploads/' + ${photo}}"
                     class="photo-item"
                     alt="Фото помещения"
                     onclick="openFullscreen(this.src)"
                     onerror="this.onerror=null; this.src='/images/no-photo.jpg';">
            </div>
            <!-- Стрелки навигации (появляются при ховере на .photos-slider) -->
            <div class="slider-arrow arrow-left" data-direction="prev">‹</div>
            <div class="slider-arrow arrow-right" data-direction="next">›</div>
            <!-- Счетчик фото (дополнительный элемент, отображает текущий индекс / всего) -->
            <div class="photo-counter"></div>
        </div>
        <div class="no-photo" th:unless="${!p.photoPaths.isEmpty()}">
            Нет фото
        </div>

        <div class="area-badge" th:text="${p.area} + ' м²'"></div>
        <div class="capacity-badge" th:text="${p.capacity} + ' чел.'"></div>

        <div class="info">
            <div class="type" th:text="${p.typeInRussian}">Офисное</div>

            <div class="amenities" th:if="${!p.amenities.isEmpty()}">
                <span th:each="a : ${p.amenities}" th:text="${p.getAmenityInRussian(a)}"></span>
            </div>

            <div class="owner" th:text="${p.contactFirstName} + ' ' + ${p.contactLastName}"></div>

            <div class="address">
                <span th:text="${p.region}"></span>,
                <span th:text="${p.city}"></span>,
                <span th:text="${p.street} + ' ' + ${p.building}"></span>
            </div>

            <div class="prices">
                <div><span class="price-label">Будни:</span> <span class="price-value" th:text="${p.priceWeekday} + ' ₽/сутки'"></span></div>
                <div th:if="${p.priceWeekend != null}"><span class="price-label">Выходные:</span> <span class="price-value" th:text="${p.priceWeekend} + ' ₽/сутки'"></span></div>
            </div>

            <a th:href="@{'/premise/' + ${p.id}}" class="details-btn">Подробнее →</a>
        </div>
    </div>
</div>

<div th:if="${premises == null || premises.isEmpty()}" style="text-align:center;padding:120px;font-size:24px;color:#999;">
    По вашему запросу ничего не найдено
</div>

<!-- Полноэкранный просмотр -->
<div id="fullscreen"
     style="display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            cursor: pointer;
            align-items: center;
            justify-content: center;"
     onclick="this.style.display='none'">
    <img id="fullImg"
         src=""
         alt="Полноэкранное фото"
         style="max-width: 95%; max-height: 95%; object-fit: contain;">
</div>

<script>
    (function() {
        // Универсальная инициализация слайдеров для каждой карточки
        function initSlider(sliderElement) {
            const container = sliderElement.querySelector('.photos-container');
            if (!container) return;
            const images = container.querySelectorAll('.photo-item');
            const totalSlides = images.length;
            if (totalSlides <= 1) {
                // Если одно фото или нет фото, стрелки и счетчик не нужны, скрываем их полностью
                const arrows = sliderElement.querySelectorAll('.slider-arrow');
                arrows.forEach(arrow => arrow.style.display = 'none');
                const counter = sliderElement.querySelector('.photo-counter');
                if (counter) counter.style.display = 'none';
                return;
            }

            let currentIndex = 0;
            const arrowLeft = sliderElement.querySelector('.arrow-left');
            const arrowRight = sliderElement.querySelector('.arrow-right');
            const counterDiv = sliderElement.querySelector('.photo-counter');

            // Функция обновления позиции слайдера
            function updateSliderPosition(instant = false) {
                const shiftPercent = - (currentIndex * 100);
                if (instant) {
                    container.style.transition = 'none';
                    container.style.transform = `translateX(${shiftPercent}%)`;
                    // force reflow чтобы transition не вернулся
                    void container.offsetHeight;
                    container.style.transition = '';
                } else {
                    container.style.transform = `translateX(${shiftPercent}%)`;
                }
                // обновляем счетчик
                if (counterDiv) {
                    counterDiv.textContent = `${currentIndex+1} / ${totalSlides}`;
                }
            }

            // Переключение слайдов
            function goNext() {
                if (totalSlides === 0) return;
                currentIndex = (currentIndex + 1) % totalSlides;
                updateSliderPosition(false);
            }

            function goPrev() {
                if (totalSlides === 0) return;
                currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
                updateSliderPosition(false);
            }

            // Назначаем обработчики на стрелки
            if (arrowLeft) arrowLeft.addEventListener('click', (e) => {
                e.stopPropagation();
                goPrev();
            });
            if (arrowRight) arrowRight.addEventListener('click', (e) => {
                e.stopPropagation();
                goPrev();
            });
            if (arrowRight) arrowRight.removeEventListener('click', goNext); // очистка на всякий случай, добавим заново
            if (arrowRight) arrowRight.addEventListener('click', (e) => {
                e.stopPropagation();
                goNext();
            });
            if (arrowLeft) arrowLeft.addEventListener('click', (e) => {
                e.stopPropagation();
                goPrev();
            });

            // Drag (мышь) для слайдера - сохраняем возможность перетаскивания, чтобы не конфликтовать со стрелками
            let isDown = false;
            let startX;
            let startTranslateX = 0;
            let currentTranslate = 0;
            let dragActive = false;
            let startTransform = 0;

            // Получаем текущее смещение в процентах
            function getCurrentTranslatePercent() {
                const transform = container.style.transform;
                if (!transform || transform === 'none') return -currentIndex * 100;
                const match = transform.match(/translateX\((-?\d+(?:\.\d+)?)%\)/);
                if (match) {
                    return parseFloat(match[1]);
                }
                return -currentIndex * 100;
            }

            container.addEventListener('mousedown', (e) => {
                if (e.target.closest('.slider-arrow')) return; // не мешаем клику по стрелкам
                isDown = true;
                dragActive = true;
                startX = e.pageX;
                // получаем текущий translateX в %
                const curTransform = getCurrentTranslatePercent();
                startTranslateX = curTransform;
                container.style.transition = 'none';
                e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const dx = e.pageX - startX;
                const sliderWidth = sliderElement.clientWidth;
                if (sliderWidth === 0) return;
                const deltaPercent = (dx / sliderWidth) * 100;
                let newTranslate = startTranslateX + deltaPercent;
                // ограничиваем диапазон: от -(totalSlides-1)*100  до 0
                const maxLeft = -(totalSlides - 1) * 100;
                const minLeft = 0;
                if (newTranslate > minLeft) newTranslate = minLeft;
                if (newTranslate < maxLeft) newTranslate = maxLeft;
                container.style.transform = `translateX(${newTranslate}%)`;
            });

            window.addEventListener('mouseup', (e) => {
                if (!isDown) return;
                isDown = false;
                if (!dragActive) {
                    dragActive = false;
                    return;
                }
                dragActive = false;
                // Определяем, на какой слайд переключиться на основе финального смещения
                const finalTransform = getCurrentTranslatePercent();
                const ratio = Math.abs(finalTransform / 100);
                let targetIndex = Math.round(ratio);
                if (targetIndex < 0) targetIndex = 0;
                if (targetIndex >= totalSlides) targetIndex = totalSlides - 1;
                // анимация к целевому индексу
                currentIndex = targetIndex;
                container.style.transition = 'transform 0.3s ease';
                updateSliderPosition(false);
                // сброс transition
                setTimeout(() => {
                    container.style.transition = '';
                }, 350);
                dragActive = false;
            });

            // Отключаем стандартный drag на изображениях, чтобы не мешать
            images.forEach(img => {
                img.addEventListener('dragstart', (e) => e.preventDefault());
            });

            // Инициализируем позицию
            updateSliderPosition(true);
            // Сброс transition после инита
            setTimeout(() => {
                container.style.transition = '';
            }, 20);
        }

        // Найти все слайдеры на странице после загрузки (в том числе динамические, но в данном случае все статичны в шаблоне)
        function initAllSliders() {
            const sliders = document.querySelectorAll('.photos-slider');
            sliders.forEach(slider => {
                // проверяем, инициализирован ли уже (защита от повторной инициализации)
                if (slider.dataset.sliderInitialized === 'true') return;
                initSlider(slider);
                slider.dataset.sliderInitialized = 'true';
            });
        }

        // Также отслеживаем, если фотографии загружаются динамически через th:each уже есть при рендере.
        // MutationObserver на случай, если контент подгружается позже (на всякий случай)
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initAllSliders);
        } else {
            initAllSliders();
        }

        // Дополнительно: для случаев, когда превью картинок могут загружаться медленно, пересчет позиции слайдера не нужен
        // но проверим изменение размеров окна, чтобы не ломалось смещение (пересчет позиции, если контейнер изменил ширину)
        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const sliders = document.querySelectorAll('.photos-slider');
                sliders.forEach(slider => {
                    const container = slider.querySelector('.photos-container');
                    if (!container) return;
                    // Сохраняем текущий индекс из data атрибута или через замыкание, но проще перечитать currentIndex из внутреннего хранилища?
                    // Но наша функция init создает замыкание, мы не можем легко получить currentIndex. Поэтому проще: сбросим отображение с сохранением индекса,
                    // но т.к. в resize важна только коррекция позиции относительно ширины, применим просто переустановку transform с текущим индексом
                    // У каждого слайдера можно хранить текущий индекс в атрибуте, но для упрощения: переинициализируем слайдеры без потери текущего слайда?
                    // В целях стабильности, проще обновить позицию, получив currentIndex из data-атрибута (сохраним его в dataset при каждом обновлении).
                    // Доработаем: в initSlider будем обновлять data-current-index при изменении.
                });
            }, 150);
        });

        // Доработаем функцию initSlider чтобы при изменении индекса сохранять атрибут, а при ресайзе восстанавливать
        // Но более элегантно: переделаем слегка инициализацию с сохранением контекста на элемент
        // Просто добавим в каждую карточку уникальный объект состояния, но для простоты - при ресайзе обновляем все слайдеры, используя их внутренний lastIndex из замыкания.
        // Однако замыкания не доступны глобально. Лучше создать WeakMap или хранить данные в самом элементе.
        // Переопределим initAllSliders с расширенной логикой хранения индекса.
        // Для надежности — перепишем инициализацию с привязкой методов к элементу.
        // Ниже улучшенная версия с сохранением currentIndex в свойстве DOM.
        function enhancedInitSlider(sliderElement) {
            const container = sliderElement.querySelector('.photos-container');
            if (!container) return;
            const images = container.querySelectorAll('.photo-item');
            const total = images.length;
            if (total <= 1) {
                const arrows = sliderElement.querySelectorAll('.slider-arrow');
                arrows.forEach(arrow => arrow.style.display = 'none');
                const cnt = sliderElement.querySelector('.photo-counter');
                if (cnt) cnt.style.display = 'none';
                return;
            }

            // Получаем или создаем хранилище индекса
            let currentIdx = 0;
            if (sliderElement.hasAttribute('data-current-idx')) {
                currentIdx = parseInt(sliderElement.getAttribute('data-current-idx')) || 0;
                if (currentIdx >= total) currentIdx = total-1;
                if (currentIdx < 0) currentIdx = 0;
            }

            function updatePosition(animate = true) {
                const shift = -(currentIdx * 100);
                if (!animate) {
                    container.style.transition = 'none';
                    container.style.transform = `translateX(${shift}%)`;
                    void container.offsetHeight;
                    container.style.transition = '';
                } else {
                    container.style.transform = `translateX(${shift}%)`;
                }
                // обновляем счетчик
                const counter = sliderElement.querySelector('.photo-counter');
                if (counter) counter.textContent = `${currentIdx+1} / ${total}`;
                sliderElement.setAttribute('data-current-idx', currentIdx);
            }

            const leftArrow = sliderElement.querySelector('.arrow-left');
            const rightArrow = sliderElement.querySelector('.arrow-right');

            function next() { currentIdx = (currentIdx + 1) % total; updatePosition(true); }
            function prev() { currentIdx = (currentIdx - 1 + total) % total; updatePosition(true); }

            if (leftArrow) {
                leftArrow.replaceWith(leftArrow.cloneNode(true));
                const newLeft = sliderElement.querySelector('.arrow-left');
                if (newLeft) newLeft.addEventListener('click', (e) => { e.stopPropagation(); prev(); });
            }
            if (rightArrow) {
                rightArrow.replaceWith(rightArrow.cloneNode(true));
                const newRight = sliderElement.querySelector('.arrow-right');
                if (newRight) newRight.addEventListener('click', (e) => { e.stopPropagation(); next(); });
            }

            // drag logic (упрощенный, но рабочий)
            let dragStart = false, startPageX = 0, startPercent = 0;
            container.addEventListener('mousedown', (e) => {
                if (e.target.closest('.slider-arrow')) return;
                dragStart = true;
                startPageX = e.pageX;
                const curTransform = container.style.transform;
                let match = curTransform && curTransform.match(/translateX\((-?\d+(?:\.\d+)?)%\)/);
                startPercent = match ? parseFloat(match[1]) : -(currentIdx * 100);
                container.style.transition = 'none';
                e.preventDefault();
            });
            window.addEventListener('mousemove', (e) => {
                if (!dragStart) return;
                const dx = e.pageX - startPageX;
                const deltaPercent = (dx / sliderElement.clientWidth) * 100;
                let newPercent = startPercent + deltaPercent;
                const maxLeft = -(total-1)*100, minLeft = 0;
                if (newPercent > minLeft) newPercent = minLeft;
                if (newPercent < maxLeft) newPercent = maxLeft;
                container.style.transform = `translateX(${newPercent}%)`;
            });
            window.addEventListener('mouseup', () => {
                if (!dragStart) return;
                dragStart = false;
                const finalTransform = container.style.transform;
                let match = finalTransform && finalTransform.match(/translateX\((-?\d+(?:\.\d+)?)%\)/);
                let percent = match ? parseFloat(match[1]) : 0;
                let newIndex = Math.round(Math.abs(percent / 100));
                if (newIndex >= total) newIndex = total-1;
                if (newIndex < 0) newIndex = 0;
                currentIdx = newIndex;
                container.style.transition = 'transform 0.3s ease';
                updatePosition(true);
                setTimeout(() => { container.style.transition = ''; }, 350);
            });
            updatePosition(false);
        }

        // Переинициализируем с улучшенной версией
        function finalInit() {
            const sliders = document.querySelectorAll('.photos-slider');
            sliders.forEach(slider => {
                if (slider.dataset.finalInit === 'true') return;
                enhancedInitSlider(slider);
                slider.dataset.finalInit = 'true';
            });
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', finalInit);
        else finalInit();
    })();

    // Полноэкранная функция
    function openFullscreen(src) {
        const fullscreenDiv = document.getElementById('fullscreen');
        const fullImg = document.getElementById('fullImg');
        fullImg.src = src;
        fullscreenDiv.style.display = 'flex';
    }
    window.openFullscreen = openFullscreen;
</script>
</body>
</html>
