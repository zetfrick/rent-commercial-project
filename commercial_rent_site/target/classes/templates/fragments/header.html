<header class="header" th:fragment="header(currentCity, currentUri)" xmlns:th="http://www.w3.org/1999/xhtml">
    <div class="nav-left">
        <a href="/about">О нас</a>

        <!-- Выбор города -->
        <div class="city-dropdown">
            <span class="current-city" th:text="${currentCity}">Нижний Новгород</span>
            <ul class="city-list">
                <li><a th:href="@{${currentUri}(city='Москва')}">Москва</a></li>
                <li><a th:href="@{${currentUri}(city='Ростов на Дону')}">Ростов на Дону</a></li>
                <li><a th:href="@{${currentUri}(city='Владимир')}">Владимир</a></li>
                <li><a th:href="@{${currentUri}(city='Владивосток')}">Владивосток</a></li>
                <li class="selected"><a th:href="@{${currentUri}(city='Нижний Новгород')}">Нижний Новгород</a></li>
            </ul>
        </div>
    </div>

    <div class="nav-right">
        <!-- Если пользователь авторизован -->
        <div th:if="${#authorization.expression('isAuthenticated()')}" class="user-login">
            <a th:href="@{/profile}" th:text="${#authentication.name}">Профиль</a> |
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" style="background: none; border: none; color: #ff9800; cursor: pointer; text-decoration: underline;">Выход</button>
            </form>
        </div>

        <!-- Если пользователь не авторизован -->
        <div th:unless="${#authorization.expression('isAuthenticated()')}" class="auth-links">
            <a href="/auth/login" class="login-link">Вход</a>
            <a href="/auth/register" class="register-link">Регистрация</a>
        </div>
    </div>
</header>
