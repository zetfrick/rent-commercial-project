<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<th:block th:fragment="header(currentUri, headerClass)">
    <header th:class="'hd-header ' + (${headerClass} != null ? ${headerClass} : '')">
        <div class="hd-nav-left">
            <a href="/" class="hd-home-link">
                <i class="fas fa-home"></i>
            </a>
            <a href="/about">О нас</a>
            <a href="/catalog">Каталог</a>
        </div>

        <div class="hd-nav-right">
            <div th:if="${#authorization.expression('isAuthenticated()')}" class="hd-user-actions">
                <!-- Кнопка уведомлений с бейджем -->
                <a href="/notifications" class="hd-notification-btn" id="hdNotificationBtn">
                    <i class="fas fa-bell"></i>
                    <span th:if="${unreadNotificationsCount > 0}" class="hd-notification-badge" th:text="${unreadNotificationsCount}"></span>
                </a>

                <!-- Профиль пользователя с выпадающим меню -->
                <div class="hd-user-profile" id="hdUserProfile">
                    <a th:href="@{/profile}" class="hd-user-info">
                        <span class="hd-user-avatar">👤</span>
                        <span class="hd-user-name" th:text="${#authentication.name}"></span>
                    </a>
                    <div class="hd-dropdown-menu" id="hdDropdownMenu">
                        <!-- Уведомления -->
                        <a th:href="@{/notifications}" class="hd-dropdown-item">
                            <i class="fas fa-bell"></i> Уведомления
                            <span th:if="${unreadNotificationsCount > 0}" class="hd-notification-badge" th:text="${unreadNotificationsCount}"></span>
                        </a>

                        <!-- Мой профиль -->
                        <a th:href="@{/profile}" class="hd-dropdown-item">
                            <i class="fas fa-user-circle"></i> Мой профиль
                        </a>

                        <!-- Сообщения и чаты с бейджем -->
                        <a th:href="@{/chats}" class="hd-dropdown-item" id="hdChatsLink">
                            <i class="fas fa-comments"></i> Сообщения и чаты
                            <span id="hdChatsBadge" class="hd-chat-badge" style="display: none;"></span>
                        </a>

                        <!-- Избранное -->
                        <a th:href="@{/profile/favorites}" class="hd-dropdown-item">
                            <i class="fas fa-heart"></i> Избранное
                        </a>

                        <!-- Сдать помещение -->
                        <a th:href="@{/premise/add}" class="hd-dropdown-item">
                            <i class="fas fa-plus-circle"></i> Сдать помещение
                        </a>

                        <!-- Мои объявления -->
                        <a th:href="@{/profile/{username}/premises(username=${#authentication.name})}" class="hd-dropdown-item">
                            <i class="fas fa-key"></i> Мои объявления
                        </a>

                        <!-- Мои аренды -->
                        <a th:href="@{/my-rentals}" class="hd-dropdown-item">
                            <i class="fas fa-building"></i> Мои аренды
                        </a>

                        <div class="hd-dropdown-divider"></div>

                        <!-- Выход -->
                        <form th:action="@{/logout}" method="post" class="hd-logout-form">
                            <button type="submit" class="hd-logout-btn-dropdown">
                                <i class="fas fa-sign-out-alt"></i> Выйти
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div th:unless="${#authorization.expression('isAuthenticated()')}" class="hd-auth-links">
                <a href="/auth/login" class="hd-login-link">Вход</a>
                <a href="/auth/register" class="hd-register-link">Регистрация</a>
            </div>
        </div>
    </header>
</th:block>

<script>
    // УЛУЧШЕННАЯ ВЕРСИЯ ДЛЯ ХЕДЕРА
    (function() {
        let lastUnreadChatsCount = 0;
        let notificationTimeout = null;

        function showFloatingNotification(message) {
            // Удаляем существующее уведомление
            const existing = document.querySelector('.floating-chat-notification');
            if (existing) existing.remove();
            if (notificationTimeout) clearTimeout(notificationTimeout);

            const notification = document.createElement('div');
            notification.className = 'floating-chat-notification';
            notification.innerHTML = `
                <i class="fas fa-comment-dots"></i>
                <span>${message}</span>
            `;
            notification.style.cssText = `
                position: fixed;
                bottom: 80px;
                right: 20px;
                background: linear-gradient(135deg, #ff5722, #ff9800);
                color: white;
                padding: 12px 20px;
                border-radius: 50px;
                z-index: 10001;
                animation: slideInRight 0.3s ease;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);
                font-size: 14px;
                font-weight: 500;
                display: flex;
                align-items: center;
                gap: 10px;
                cursor: pointer;
            `;
            notification.onclick = () => {
                window.location.href = '/chats';
            };
            document.body.appendChild(notification);

            notificationTimeout = setTimeout(() => {
                notification.style.opacity = '0';
                setTimeout(() => notification.remove(), 300);
            }, 5000);
        }

        function updateChatBadge() {
            const badgeElement = document.getElementById('hdChatsBadge');
            if (!badgeElement) return;

            const unreadCount = localStorage.getItem('unreadChatsCount');
            const count = unreadCount ? parseInt(unreadCount) : 0;

            if (count > 0) {
                badgeElement.textContent = count;
                badgeElement.style.display = 'inline-flex';
            } else {
                badgeElement.style.display = 'none';
                badgeElement.textContent = '0';
            }
        }

        async function loadUnreadChatsCount() {
            try {
                const response = await fetch('/chats/api/chats', {
                    credentials: 'include',
                    headers: { 'Cache-Control': 'no-cache' }
                });

                if (response.ok) {
                    const chats = await response.json();
                    const totalUnread = chats.reduce((sum, chat) => sum + (chat.unreadCount || 0), 0);

                    const previousCount = parseInt(localStorage.getItem('unreadChatsCount') || '0');
                    localStorage.setItem('unreadChatsCount', totalUnread);
                    updateChatBadge();

                    // Если количество увеличилось - показываем уведомление
                    if (totalUnread > previousCount && totalUnread > 0) {
                        const newCount = totalUnread - previousCount;
                        const message = newCount === 1
                            ? '📨 У вас новое сообщение!'
                            : `📨 У вас ${newCount} новых сообщений!`;
                        showFloatingNotification(message);
                    }

                    console.log('Header loaded unread chats:', totalUnread);
                } else if (response.status === 401) {
                    localStorage.removeItem('unreadChatsCount');
                    updateChatBadge();
                }
            } catch (error) {
                console.error('Header error loading chats count:', error);
                updateChatBadge();
            }
        }

        function initMobileMenu() {
            const userProfile = document.getElementById('hdUserProfile');
            if (userProfile && window.innerWidth <= 768) {
                userProfile.addEventListener('click', function(e) {
                    e.stopPropagation();
                    this.classList.toggle('active');
                });
                document.addEventListener('click', function() {
                    userProfile.classList.remove('active');
                });
            }

            if (userProfile && window.innerWidth > 768) {
                userProfile.addEventListener('mouseenter', function() {
                    this.classList.add('active');
                });
                userProfile.addEventListener('mouseleave', function() {
                    this.classList.remove('active');
                });
            }
        }

        // Добавляем стиль анимации
        if (!document.querySelector('#chatNotificationStyle')) {
            const style = document.createElement('style');
            style.id = 'chatNotificationStyle';
            style.textContent = `
                @keyframes slideInRight {
                    from { transform: translateX(120%); opacity: 0; }
                    to { transform: translateX(0); opacity: 1; }
                }
                .floating-chat-notification {
                    cursor: pointer;
                }
                .floating-chat-notification:hover {
                    transform: scale(1.02);
                }
            `;
            document.head.appendChild(style);
        }

        // Запуск при загрузке страницы
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                initMobileMenu();
                loadUnreadChatsCount();
                setInterval(loadUnreadChatsCount, 10000);
            });
        } else {
            initMobileMenu();
            loadUnreadChatsCount();
            setInterval(loadUnreadChatsCount, 10000);
        }

        window.addEventListener('focus', function() {
            loadUnreadChatsCount();
        });

        window.debugChatBadge = { updateChatBadge, loadUnreadChatsCount };
    })();
</script>

</body>
</html>
