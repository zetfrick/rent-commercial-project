<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #fff5eb 0%, #ffe0cc 100%);
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 50%;
            right: -10%;
            width: 40%;
            height: 80%;
            background: radial-gradient(circle, rgba(255, 87, 34, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: 20%;
            left: -10%;
            width: 40%;
            height: 60%;
            background: radial-gradient(circle, rgba(255, 152, 0, 0.04) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .auth-form {
            background: white;
            padding: 40px;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            width: 450px;
            text-align: center;
            position: relative;
            z-index: 2;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-form h2 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #ff5722;
        }

        .login-hint {
            background: #e8f5e9;
            padding: 10px 14px;
            border-radius: 16px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #4caf50;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .login-hint i {
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .password-wrapper {
            position: relative;
        }

        .auth-form input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #ffe0cc;
            border-radius: 16px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            background: #fffaf5;
            box-sizing: border-box;
        }

        .auth-form input:focus {
            outline: none;
            border-color: #ff5722;
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 87, 34, 0.1);
        }

        /* Отключаем нативную кнопку показа пароля */
        .password-wrapper input::-ms-reveal,
        .password-wrapper input::-ms-clear {
            display: none;
        }
        .password-wrapper input::-webkit-credentials-auto-fill-button,
        .password-wrapper input::-webkit-textfield-decoration-container {
            display: none;
        }
        .password-wrapper input {
            -webkit-appearance: none;
            appearance: none;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
            font-size: 18px;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: #ff5722;
        }

        .auth-form button {
            width: 100%;
            background: linear-gradient(135deg, #ff5722, #ff9800);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 10px;
            font-family: 'Inter', sans-serif;
        }

        .auth-form button:hover {
            background: #e64a19;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.3);
        }

        .auth-form a {
            display: block;
            margin-top: 10px;
            color: #ff9800;
            text-decoration: none;
            font-size: 14px;
        }

        .auth-form a:hover {
            text-decoration: underline;
        }

        .error {
            color: #f44336;
            margin: 10px 0;
            font-size: 14px;
            background: #ffebee;
            padding: 10px;
            border-radius: 12px;
        }

        .success {
            color: #4caf50;
            margin: 10px 0;
            font-size: 14px;
            background: #e8f5e9;
            padding: 10px;
            border-radius: 12px;
        }

        .links {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .links a {
            margin-top: 0;
        }

        @media (max-width: 480px) {
            .auth-form { width: 90%; padding: 30px 20px; margin: 20px; }
            .links { flex-direction: column; gap: 10px; }
            .links a { text-align: center; }
        }
    </style>
</head>
<body>
<div class="auth-form">
    <h2>Вход</h2>

    <div class="login-hint">
        <i class="fas fa-info-circle"></i> Введите логин <strong>ИЛИ</strong> email
    </div>

    <div th:if="${param.error}" class="error">Неверный логин/email или пароль. Попробуйте снова.</div>
    <div th:if="${param.reset == 'success'}" class="success">Пароль успешно изменён! Войдите с новым паролем.</div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Логин или Email</label>
            <input type="text" name="username" placeholder="Введите логин или email" required>
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <div class="password-wrapper">
                <input type="password" name="password" id="loginPassword" placeholder="Введите пароль" required>
                <i class="fas fa-eye toggle-password" onclick="toggleLoginPassword()"></i>
            </div>
        </div>
        <button type="submit">Войти</button>
    </form>

    <div class="links">
        <a href="/auth/register">Нет аккаунта?</a>
        <a href="/auth/forgot-password">Забыли пароль?</a>
    </div>
</div>

<script>
    function toggleLoginPassword() {
        const passwordInput = document.getElementById('loginPassword');
        const icon = document.querySelector('#loginPassword + .toggle-password');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
</script>
</body>
</html>
